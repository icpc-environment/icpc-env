# kattis cli, clone git to /opt/kattis-cli: git clone https://github.com/Kattis/kattis-cli
- name: Clone kattis cli
  ansible.builtin.git:
    repo: https://github.com/Kattis/kattis-cli
    dest: /opt/kattis-cli
    force: true

- name: Install kattis cli dependencies
  ansible.builtin.apt:
    state: present
    pkg:
      - python3-lxml
      - python3-requests

# /usr/local/etc/kattisrc, with the contest's URLs, is written by icpc-apply
# from submit.base_url; a team's ~/.kattisrc adds its username and password
- name: Install the kattis command
  ansible.builtin.copy:
    src: files/kattis/kattis
    dest: /usr/local/bin/kattis
    mode: "0755"
