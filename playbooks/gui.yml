---
- name: Install the packages necessary to make xfce run
  ansible.builtin.apt:
    state: present
    pkg:
      - xserver-xorg
      - lightdm
      # This keeps us from installing unity-greeter, which would pull in unity-settings and ibus(which breaks ctrl+space autocomplete in eclipse)
      - lightdm-gtk-greeter
# suggests:
# colord cups-common gvfs liblcms2-utils librsvg2-bin lm-sensors bindfs
# desktop-base xfonts-100dpi | xfonts-75dpi xfonts-scalable xinput
# firmware-amd-graphics xserver-xorg-video-r128 xserver-xorg-video-mach64
# firmware-misc-nonfree

- name: Set background in lightdm-gtk-greeter.conf
  ansible.builtin.lineinfile:
    path: /etc/lightdm/lightdm-gtk-greeter.conf
    regexp: '^#(background).*$'
    line: '\1=/usr/share/backgrounds/ICPCLogo-greeter.png'
    backrefs: true

- name: Install xfce and friends(without their recommended packages)
  ansible.builtin.apt:
    state: present
    install_recommends: false
    pkg:
      # Turns it into something resembling xubuntu(themes/etc)
      - xubuntu-default-settings
      - xfce4
      # recommends for xfce4
      - desktop-base
      - tango-icon-theme
      - thunar-volman
      - thunar-archive-plugin
      # power management/terminal
      - xfce4-power-manager
      - xfce4-power-manager-plugins
      - xfce4-terminal

      # So we can show the output of commands in the panel (used for showing team name/info)
      - xfce4-genmon-plugin
      # for PrintScreen
      - xfce4-screenshooter


- name: Add mozilla firefox ppa (because snaps are dumb)
  block:
    - name: Fetch the signing key
      ansible.builtin.get_url:
        url: https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x0ab215679c571d1c8325275b9bdb3d89ce49ec21
        dest: /etc/apt/keyrings/mozillateamppa.asc

    - name: Add the mozilla team ppa
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/mozillateamppa.asc] https://ppa.launchpadcontent.net/mozillateam/ppa/ubuntu  {{ ansible_distribution_release }} main"
        state: present
        update_cache: true

- name: Apt preference for firefox to only install from the ppa
  ansible.builtin.copy:
    dest: /etc/apt/preferences.d/mozilla-firefox
    content: |
      Package: firefox
      Pin: release o=LP-PPA-mozillateam
      Pin-Priority: 1001
    mode: "0644"
    owner: "root"
    group: "root"

