---
- name: install the packages necessary to make xfce run
  apt:
    state: present
    pkg:
      - xserver-xorg
      - lightdm
      - lightdm-gtk-greeter   # This keeps us from installing unity-greeter, which would pull in unity-settings and ibus(which breaks ctrl+space autocomplete in eclipse)
# suggests:
# colord cups-common gvfs liblcms2-utils librsvg2-bin lm-sensors bindfs
# desktop-base xfonts-100dpi | xfonts-75dpi xfonts-scalable xinput
# firmware-amd-graphics xserver-xorg-video-r128 xserver-xorg-video-mach64
# firmware-misc-nonfree


- name: install xfce and friends(without their recommended packages)
  apt:
    state: present
    install_recommends: false
    pkg:
      # Turns it into something resembling xubuntu(themes/etc)
      - xubuntu-default-settings
      - xfce4
      # recommends for xfce4
      - desktop-base
      - tango-icon-theme
      - thunar-volman
      - thunar-archive-plugin
      - engrampa # archive manager
      # power management/terminal
      - xfce4-power-manager
      - xfce4-power-manager-plugins
      - xfce4-terminal
      # So we can show the output of commands in the panel (used for showing team name/info)
      - xfce4-genmon-plugin


- name: Add mozilla firefox ppa (because snaps are dumb)
  block:
    - name: Fetch the signing key
      ansible.builtin.get_url:
        url: https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x0ab215679c571d1c8325275b9bdb3d89ce49ec21
        dest: /etc/apt/keyrings/mozillateamppa.asc

    - name: Add the mozilla team ppa
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/mozillateamppa.asc] https://ppa.launchpadcontent.net/mozillateam/ppa/ubuntu  {{ ansible_distribution_release }} main"
        state: present
        update_cache: true

- name: apt preference for firefox to only install from the ppa
  copy:
    dest: /etc/apt/preferences.d/mozilla-firefox
    content: |
      Package: firefox
      Pin: release o=LP-PPA-mozillateam
      Pin-Priority: 1001

- name: install gui apps
  apt:
    state: present
    pkg:
      - firefox   # Web browser (from ppa, not snap)
      - alacarte  # Menu editor
      - mupdf     # Lighweight pdf viewer
      - mate-calc # GUI calculator

  # kalgebra - seems nice, basically a graphing calculator, but it ends up in some new education submenu
  # gnome-genius - way overkill/has it's own language thing. reminds me of r or ipython notebooks
  # gnome-calculator - sucks
  # qalculate-gtk - has a bunch of extra advanced things, might be nice to leave in there, but maybe too fancy?
  # kcalc - # ok, but mate-calc is better

- name: Remove unneeded packages
  apt:
    state: absent
    purge: yes
    pkg:
      - gdm3
      - gnome-shell
      - byobu
      - xscreensaver
      - xscreensaver-data
      - yelp
      - desktop-base
      - vlc-data

- name: setup lightdm
  copy: src=files/lightdm.conf dest=/etc/lightdm/lightdm.conf

- name: configure xorg/x11
  copy: src=files/xorg.conf dest=/etc/X11/xorg.conf

# delete some template stuff (it creates OpenDocument Text.odt, OpenDocument Sheets.ods and something else in the home directory)
- name: delete the xdg template creator autostart
  file:
    state: absent
    path: /etc/xdg/xdg-xubuntu/autostart/xdg-xubuntu-templates.desktop

- name: delete some .desktop shortcuts (so they don't show up in the applications menu)
  file:
    state: absent
    path: /usr/share/applications/{{ item }}
  with_items:
    - thunar-bulk-rename.desktop      # System->Bulk Rename
    - xfce4-mail-reader.desktop       # Mail Reader
    - thunar-volman-settings.desktop  # Removable devices and media

- name: copy a script to help mirror displays
  copy:
    src: files/mirror-displays.sh
    dest: /usr/local/bin/mirror-displays
    mode: 0755
