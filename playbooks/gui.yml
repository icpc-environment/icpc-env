- name: Install gui apps
  ansible.builtin.apt:
    state: present
    pkg:
      - firefox   # Web browser (from ppa, not snap)
      - alacarte  # Menu editor
      - mupdf     # Lighweight pdf viewer
      - mate-calc # GUI calculator
      - engrampa  # archive manager

  # kalgebra - seems nice, basically a graphing calculator, but it ends up in some new education submenu
  # gnome-genius - way overkill/has it's own language thing. reminds me of r or ipython notebooks
  # gnome-calculator - sucks
  # qalculate-gtk - has a bunch of extra advanced things, might be nice to leave in there, but maybe too fancy?
  # kcalc - # ok, but mate-calc is better

- name: Remove unneeded packages
  ansible.builtin.apt:
    state: absent
    purge: true
    pkg:
      - gdm3
      - gnome-shell
      - byobu
      - xscreensaver
      - xscreensaver-data
      - yelp
      - desktop-base
      - vlc-data

- name: Setup lightdm
  ansible.builtin.copy:
    content: |
      [SeatDefaults]
      greeter-session=lightdm-gtk-greeter
      # Set xfce as the default
      user-session=xubuntu
      # Autologin
      autologin-user=contestant
      autologin-timeout=0
      # Disable guest session
      allow-guest=false

    dest: /etc/lightdm/lightdm.conf
    mode: "0644"
    owner: "root"
    group: "root"

- name: Set monitor to not blank
  ansible.builtin.copy:
    content: |
      # Disable screen blanking/display power management(this will keep the display on all the time)
      Section "Extensions"
        Option "DPMS"        "false"
      EndSection
      Section "ServerFlags"
        Option "BlankTime"   "0"
        Option "StandbyTime" "0"
        Option "SuspendTime" "0"
        Option "OffTime"     "0"
      EndSection
    dest: /usr/share/X11/xorg.conf.d/99-icpc-monitor.conf
    owner: root
    group: root
    mode: "0644"

# Delete some template stuff (it creates OpenDocument Text.odt, OpenDocument Sheets.ods and something else in the home directory)
- name: Delete the xdg template creator autostart
  ansible.builtin.file:
    state: absent
    path: /etc/xdg/xdg-xubuntu/autostart/xdg-xubuntu-templates.desktop

- name: Delete some .desktop shortcuts (so they don't show up in the applications menu)
  ansible.builtin.file:
    state: absent
    path: /usr/share/applications/{{ item }}
  with_items:
    - thunar-bulk-rename.desktop      # System->Bulk Rename
    - xfce4-mail-reader.desktop       # Mail Reader
    - thunar-volman-settings.desktop  # Removable devices and media

- name: Copy a script to help mirror displays
  ansible.builtin.copy:
    src: files/mirror-displays.sh
    dest: /usr/local/bin/mirror-displays
    mode: 0755
