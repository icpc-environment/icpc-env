---
- name: install wireguard-tools
  apt: pkg=wireguard-tools state=present

- name: set up private key
  copy:
    src: files/secrets/jumpy@icpc
    mode: 0400
    owner: root
    group: root
    dest: /root/.ssh/id_ed25519
- name: set up private key certificate
  copy:
    src: files/secrets/jumpy@icpc-cert.pub
    mode: 0400
    owner: root
    group: root
    dest: /root/.ssh/id_ed25519-cert.pub

- name: copy the wg_setup script
  template:
    src: files/wg_setup.j2
    dest: /usr/local/bin/wg_setup
    mode: 0755

- name: create wireguard service to initialize vpn details (fetch credentials and whatnot)
  template: src=files/wg-setup.service.j2 dest=/etc/systemd/system/wg-setup.service

- name: enable wg-setup service
  service: enabled=yes name=wg-setup

- name: add some aliases for the vpn server to our /etc/hosts file
  lineinfile:
    dest: /etc/hosts
    line: '{{ contestmanager_ip }} contestmanager.icpcnet.internal contestmanager'
    state: present

- name: install wstunnel (for wireguard websocket tunnel fallback)
  unarchive:
    src: https://github.com/erebe/wstunnel/releases/download/v9.2.2/wstunnel_9.2.2_linux_amd64.tar.gz
    dest: /usr/local/bin
    remote_src: true
    include: ['wstunnel']
    creates: /usr/local/bin/wstunnel
- name: make wstunnel executable
  file:
    state: file
    path: /usr/local/bin/wstunnel
    mode: 0755
- name: set up wstunnel service so we can access it via websocket (at 127.0.0._10_, not .1 for security
  copy:
    dest: /etc/systemd/system/wstunnel.service
    content: |
      [Unit]
      Description=Tunnel WG UDP over websocket to our management host
      After=network.target

      [Service]
      Type=simple
      DynamicUser=yes
      ExecStart=/usr/local/bin/wstunnel client \
        -L udp://127.0.0.10:51820:127.0.0.1:51820 \
        wss://{{ wireguard_host }} \
        --http-upgrade-path-prefix /wgtunnel/
      Restart=always
      RestartSec=5

      [Install]
      WantedBy=multi-user.target
- name: enable wstunnel service
  service: enabled=yes name=wstunnel




# Install tailscale
# curl -fsSL https://pkgs.tailscale.com/stable/ubuntu/noble.noarmor.gpg | sudo tee /usr/share/keyrings/tailscale-archive-keyring.gpg >/dev/null
# curl -fsSL https://pkgs.tailscale.com/stable/ubuntu/noble.tailscale-keyring.list | sudo tee /etc/apt/sources.list.d/tailscale.list
- name: apt key for tailscale
  ansible.builtin.get_url:
    url: https://pkgs.tailscale.com/stable/ubuntu/{{ ansible_distribution_release }}.noarmor.gpg
    dest: /etc/apt/keyrings/tailscale-archive-keyring.gpg
- name: add tailscale apt repo
  ansible.builtin.apt_repository:
    repo: deb [signed-by=/etc/apt/keyrings/tailscale-archive-keyring.gpg] https://pkgs.tailscale.com/stable/ubuntu {{ ansible_distribution_release }} main
    state: present
    filename: /etc/apt/sources.list.d/tailscale.list
    update_cache: yes
- name: install tailscale
  apt:
    pkg: tailscale
    state: present

- name: set up tailscale login as a systemd service to auth/join our tailnet
  copy:
    dest: /etc/systemd/system/tailscale-login.service
    content: |
      [Unit]
      Description=Make sure tailscale is logged in and running
      After=network.target

      [Service]
      Type=oneshot
      ExecStart=/usr/bin/tailscale up --accept-dns=false --auth-key {{ tailscale_auth_key }} --login-server {{ tailscale_login_server }}
      Restart=on-failure
      RestartSec=5

      [Install]
      WantedBy=multi-user.target
- name: enable tailscale-login service
  service: enabled=yes name=tailscale-login

