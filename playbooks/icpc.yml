---
- name: Create icpc directory
  ansible.builtin.file:
    path: /icpc
    state: directory
    mode: "0755"

- name: Copy icpc scripts
  ansible.builtin.copy:
    src: files/scripts
    dest: /icpc
    mode: "0755"

- name: Add a supported_languages file
  ansible.builtin.copy:
    dest: /icpc/supported_languages
    content: |
      {% for l in languages %}
      {{ l }}
      {% endfor %}
    mode: "0644"

- name: Write the machine config
  ansible.builtin.copy:
    dest: /icpc/config.json
    mode: "0644"
    content: "{{ icpc_config | to_nice_json }}\n"
  vars:
    icpc_config:
      contest: "{{ contest_id }}"
      remote_management_server: "{{ remote_management_server }}"
      remote_management_vpn_enabled: "{{ remote_management_vpn_enabled | bool }}"
      remote_management_lastminute_enabled: "{{ remote_management_lastminute_enabled | bool }}"
      config_url: "{{ config_url }}"
      papersize: "{{ icpc_papersize | default('letter') }}"
      timezone: "{{ icpc_timezone }}"
      language_scripts: "{{ language_scripts }}"
      submit:
        client: "{{ submit_ccs }}"
        pc2_base_url: "{{ pc2_submit_base_url }}"
      autostart_firefox: true
      reverseproxy_sites: "{{ reverseproxy_sites | default({}) }}"
      firefox_policies: "{{ firefox_policies | default({}) }}"

- name: Create printfile symlink(to match world finals image)
  ansible.builtin.file:
    src: /icpc/scripts/pcpr
    dest: /icpc/scripts/printfile
    state: link

- name: Setup PATH variable
  ansible.builtin.copy:
    dest: /etc/profile.d/icpc_path.sh
    content: |
      export PATH="/icpc/scripts:$PATH"

- name: Copy icpc default wallpaper
  ansible.builtin.copy:
    dest: /icpc/wallpaper.png
    src: files/wallpaper.png

- name: Install ICPC tools we need
  ansible.builtin.apt:
    state: present
    pkg:
      - apache2-utils
      # For streaming a contestant desktop/webcam
      - ffmpeg
      - intel-media-va-driver-non-free
      - vlc
      # Audio stack. 26.04 defaults to pipewire, and the pulseaudio package
      # conflicts with pipewire-pulse, so asking for it downgrades the system.
      - pipewire-audio
      - wireplumber
      - openprinting-ppds
      - git
      - imagemagick
      - cups
      - cups-bsd
      - paps # UTF-8 clean replacement for enscript, used by files/scripts/pcpr
      - jc # for json output from various commands (used by firstLogin.sh)
      - python3-typing-extensions # needed for firstboot script

#      # experimental programs to support showing a banner image to all contestants
      - feh # to display fullscreen images
      - wmctrl # can set always on top, plus check if it's still the active window and restart it if not (e.g. ctrl+alt+left/right swap desktops)
      - xdotool # to detect if it's still on top/other things?
      - python3-xlib  # maybe we'll write our own xorg fullscreen thing to replace the above 3 things...

- name: Stop/disable cups-browsed from autodiscovering printers
  ansible.builtin.systemd:
    name: cups-browsed
    state: stopped
    enabled: false
    masked: true




- name: Copy the ssh CA
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/secrets/{{ contest_id }}/server_ca.pub"
    dest: /etc/ssh/ca.pub
    mode: "0644"
    owner: root
    group: root

- name: Configure the ssh CA to be enabled for allowing users to log in
  ansible.builtin.copy:
    content: |
      TrustedUserCAKeys /etc/ssh/ca.pub
    dest: /etc/ssh/sshd_config.d/trusted-user-ca.conf
    mode: "0644"
    owner: root
    group: root

- name: Install a set of host keys that are signed by the ssh CA
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/secrets/{{ contest_id }}/contestant.icpcnet.internal_{{ item.name }}"
    dest: /etc/ssh/ssh_{{ item.name }}
    mode: "{{ item.mode }}"
    owner: root
    group: root
  loop:
    # sshd refuses a host key that anything but root can read
    - {name: host_ed25519_key, mode: "0600"}
    - {name: host_ed25519_key.pub, mode: "0644"}
    - {name: host_ed25519_key-cert.pub, mode: "0644"}
  notify: Restart ssh

- name: sshd host certificate
  ansible.builtin.copy:
    content: |
      HostKey /etc/ssh/ssh_host_ed25519_key
      HostCertificate /etc/ssh/ssh_host_ed25519_key-cert.pub
    dest: /etc/ssh/sshd_config.d/ssh_host_cert.conf
    mode: "0644"
    owner: root
    group: root
  notify: Restart ssh


