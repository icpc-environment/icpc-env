- name: Uninstall commands we do not want
  ansible.builtin.apt:
    state: absent
    name:
      - command-not-found
      - bluez
      - bluez-obexd
      - apport

- name: Cleanup command-not-found dir
  ansible.builtin.file:
    path: /var/lib/command-not-found
    state: absent

- name: Create /usr/share/doc/icpc
  ansible.builtin.file:
    name: /usr/share/doc/icpc
    state: directory
    mode: '0755'
    owner: root
    group: root

