- name: Create the icpcadmin group
  ansible.builtin.group:
    name: icpcadmin
    state: present
- name: Create the icpcadmin user
  ansible.builtin.user:
    name: icpcadmin
    comment: ICPC Local Admin
    group: icpcadmin
    groups: sudo,adm,lpadmin
    password: "{{ icpcadmin_pass | password_hash('sha512') }}"
    # password_hash picks a new salt every run, so without this the task always
    # reports changed
    update_password: on_create
    shell: /bin/bash

- name: Create icpcadmin's .ssh
  ansible.builtin.file:
    path: /home/icpcadmin/.ssh
    state: directory
    owner: icpcadmin
    group: icpcadmin
    mode: "0700"
- name: Let the build log in as icpcadmin until makeDist.sh
  ansible.builtin.copy:
    dest: /home/icpcadmin/.ssh/authorized_keys2
    content: |
      {% for key in build_ssh_keys %}
      {{ key }}
      {% endfor %}
    owner: icpcadmin
    group: icpcadmin
    mode: "0600"

- name: Make sure desktop directory exists
  ansible.builtin.file:
    path: /home/icpcadmin/Desktop
    state: directory
    owner: icpcadmin
    group: icpcadmin
- name: Copy admin desktop shortcuts
  ansible.builtin.copy:
    src: files/admin-desktop-shortcuts/{{ item }}
    dest: /home/icpcadmin/Desktop/{{ item }}
    owner: icpcadmin
    group: icpcadmin
    mode: '0755'
  loop:
    - 'Factory Reset.desktop'
    - 'Reconfigure System.desktop'
    - 'Self Test.desktop'
    - 'Wipe Team Account.desktop'
- name: Remove any autostart files for icpcadmin that might have come over from /etc/skel
  ansible.builtin.file:
    path: /home/icpcadmin/.config/autostart
    state: absent

- name: Create the contestant group
  ansible.builtin.group:
    name: contestant
    state: present
- name: Create the contestant user (with empty/blank password)
  ansible.builtin.user:
    name: contestant
    group: contestant
    groups: ''
    password: '$1$salty$lOyh/41oDtq.J4v0Lltp4.'
    update_password: on_create
    shell: /bin/bash
  notify:
    - Clear user password


- name: Create the team reset group
  ansible.builtin.group:
    name: teamreset
    state: present
- name: Create the team reset user
  ansible.builtin.user:
    name: teamreset
    comment: Clear Team Account
    group: teamreset
    groups: sudo,adm,lpadmin
    create_home: false
    password: "{{ icpcadmin_pass | password_hash('sha512') }}"
    update_password: on_create
    shell: /bin/bash
- name: Make the teamreset home folder/autostart path
  ansible.builtin.file:
    path: /home/teamreset/.config/autostart
    state: directory
    owner: teamreset
    group: teamreset
    mode: "0755"
- name: Create the teamreset autostart file
  ansible.builtin.copy:
    src: files/teamreset.desktop
    dest: /home/teamreset/.config/autostart/teamreset.desktop
    owner: teamreset
    group: teamreset
    mode: "0644"

- name: Setup sudo for the admin(s)
  ansible.builtin.copy:
    dest: /etc/sudoers.d/icpcadmins
    mode: "0440"
    owner: root
    group: root
    content: |
      # icpcadmin can run any command without a password
      icpcadmin ALL=NOPASSWD: ALL
      teamreset ALL=NOPASSWD: ALL

- name: Check for ICPC partition
  ansible.builtin.command: blkid -L "ICPC"
  register: icpc_partition
  failed_when: false
  changed_when: false

- name: If there is an icpc partition
  when: icpc_partition.rc == 0
  block:
    - name: Create the usb drive mountpoint
      when: "'/mnt/usbdrive' not in ansible_mounts | map(attribute='mount')"
      ansible.builtin.file:
        path: /mnt/usbdrive
        state: directory
        owner: root
        group: root
        mode: "0755"
    - name: Mount the fat32 partition
      ansible.posix.mount:
        path: /mnt/usbdrive
        src: LABEL=ICPC
        fstype: vfat
        opts: defaults,uid=contestant,gid=contestant
        state: present
    - name: Create a symlink to the usb drive in /etc/skel
      ansible.builtin.file:
        src: /mnt/usbdrive
        dest: "/etc/skel/USB Drive"
        state: link
        follow: false
        owner: root
        group: root
        mode: '0755'


- name: Include firstboot setup
  ansible.builtin.import_tasks: management/firstboot-setup.yml

- name: Create /usr/share/doc/icpc
  ansible.builtin.file:
    path: /usr/share/doc/icpc
    state: directory
    mode: '0755'
    owner: root
    group: root

