---
- name: Create icpc directory
  ansible.builtin.file:
    path: /icpc
    state: directory
    mode: "0755"

- name: Copy icpc scripts
  ansible.builtin.copy:
    src: files/scripts
    dest: /icpc
    mode: "0755"

- name: Add a supported_languages file
  ansible.builtin.copy:
    dest: /icpc/supported_languages
    content: |
      {% for l in languages %}
      {{ l }}
      {% endfor %}
    mode: "0644"

- name: Check the setup wizard can verify what it fetches from config_url
  ansible.builtin.assert:
    that: config_signers | length > 0
    fail_msg: >-
      config_url is set but config_signers is empty, so the setup wizard would
      refuse every file it fetches. Add the publisher's allowed_signers line.
    quiet: true
  when: config_url | length > 0

- name: Create /etc/icpc
  ansible.builtin.file:
    path: /etc/icpc
    state: directory
    mode: "0755"

# Not in /icpc/config.json, which `icpc-config set` can change
- name: Install the keys config_url's files must be signed with
  ansible.builtin.copy:
    dest: /etc/icpc/config-signers
    content: |
      {% for line in config_signers %}
      {{ line }}
      {% endfor %}
    mode: "0644"
    owner: root
    group: root

- name: Write the machine config
  ansible.builtin.copy:
    dest: /icpc/config.json
    mode: "0644"
    content: "{{ icpc_config | to_nice_json }}\n"
  vars:
    icpc_config:
      contest: "{{ contest_id }}"
      management:
        server: "{{ remote_management_server }}"
        fleet: "{{ contest_id }}"
        vpn: "{{ remote_management_vpn_enabled | bool }}"
        lastminute: "{{ remote_management_lastminute_enabled | bool }}"
      config_url: "{{ config_url }}"
      config_contest: "{{ config_contest }}"
      papersize: "{{ icpc_papersize | default('letter') }}"
      timezone: "{{ icpc_timezone }}"
      wallpaper_url: file:///usr/share/backgrounds/icpc/wallpaper.png
      language_scripts: "{{ language_scripts }}"
      submit:
        client: "{{ submit_ccs }}"
        base_url: "{{ submit_base_url }}"
      autostart_firefox: true
      reverseproxy_sites: "{{ reverseproxy_sites | default({}) }}"
      ssh_keys: "{{ ssh_keys }}"
      ssh_user_ca_keys: "{{ ssh_user_ca_keys }}"
      ssh_principals: "{{ ssh_principals }}"
      firefox_policies: "{{ firefox_policies | default({}) }}"

- name: Create printfile symlink(to match world finals image)
  ansible.builtin.file:
    src: /icpc/scripts/pcpr
    dest: /icpc/scripts/printfile
    state: link

- name: Setup PATH variable
  ansible.builtin.copy:
    dest: /etc/profile.d/icpc_path.sh
    content: |
      export PATH="/icpc/scripts:$PATH"

- name: Create the directory for the image's own wallpaper
  ansible.builtin.file:
    path: /usr/share/backgrounds/icpc
    state: directory
    mode: "0755"

# wallpaper_url in config.json points here; icpc-apply copies it to /icpc/wallpaper.png
- name: Install the contest's wallpaper
  ansible.builtin.copy:
    dest: /usr/share/backgrounds/icpc/wallpaper.png
    src: "{{ icpc_wallpaper }}"
    mode: "0644"
  when: icpc_wallpaper is not match('https?://')

- name: Download the contest's wallpaper
  ansible.builtin.get_url:
    dest: /usr/share/backgrounds/icpc/wallpaper.png
    url: "{{ icpc_wallpaper }}"
    mode: "0644"
    force: true
  when: icpc_wallpaper is match('https?://')

- name: Install ICPC tools we need
  ansible.builtin.apt:
    state: present
    pkg:
      - apache2-utils
      # For streaming a contestant desktop/webcam
      - ffmpeg
      - intel-media-va-driver-non-free
      - vlc
      # Audio stack. 26.04 defaults to pipewire, and the pulseaudio package
      # conflicts with pipewire-pulse, so asking for it downgrades the system.
      - pipewire-audio
      - wireplumber
      - openprinting-ppds
      - git
      - imagemagick
      - cups
      - cups-bsd
      - paps # UTF-8 clean replacement for enscript, used by files/scripts/pcpr
      - jc # for json output from various commands (used by firstLogin.sh)
      - python3-typing-extensions # needed for firstboot script

#      # experimental programs to support showing a banner image to all contestants
      - feh # to display fullscreen images
      - wmctrl # can set always on top, plus check if it's still the active window and restart it if not (e.g. ctrl+alt+left/right swap desktops)
      - xdotool # to detect if it's still on top/other things?
      - python3-xlib  # maybe we'll write our own xorg fullscreen thing to replace the above 3 things...

- name: Stop/disable cups-browsed from autodiscovering printers
  ansible.builtin.systemd:
    name: cups-browsed
    state: stopped
    enabled: false
    masked: true




# icpc-apply writes both from ssh_user_ca_keys and ssh_principals in /icpc/config.json
- name: Let admins log in with certificates
  ansible.builtin.copy:
    content: |
      TrustedUserCAKeys /etc/ssh/ca.pub
      AuthorizedPrincipalsFile /etc/ssh/principals/%u
    dest: /etc/ssh/sshd_config.d/trusted-user-ca.conf
    mode: "0644"
    owner: root
    group: root
  notify: Restart ssh

- name: Create missing ssh host keys at boot
  ansible.builtin.copy:
    dest: /etc/systemd/system/icpc-host-identity.service
    content: |
      [Unit]
      Description=Create this machine's ssh host keys, and name it after them until setup
      Before=ssh.service sshd.service ssh.socket wg-setup.service display-manager.service

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      ExecStart=/icpc/scripts/host-identity

      [Install]
      WantedBy=multi-user.target
    mode: "0644"
    owner: root
    group: root

- name: Enable icpc-host-identity
  ansible.builtin.systemd:
    name: icpc-host-identity
    enabled: true
    daemon_reload: true

# wg_setup adds a HostCertificate once wg-fleet has signed this key
- name: Only offer the ed25519 host key
  ansible.builtin.copy:
    content: |
      HostKey /etc/ssh/ssh_host_ed25519_key
    dest: /etc/ssh/sshd_config.d/ssh_host_key.conf
    mode: "0644"
    owner: root
    group: root
  notify: Restart ssh


