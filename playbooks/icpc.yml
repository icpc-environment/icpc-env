- name: Check for ICPC partition
  ansible.builtin.shell: blkid -L "ICPC"
  register: icpc_partition
  ignore_errors: true
  failed_when: false
  changed_when: false

- name: If there is an icpc partition
  ansible.builtin.when: icpc_partition.rc == 0
  block:
  - name: create mountpoint
    ansible.builtin.file: path=/mnt/usbdrive state=directory
  - name: mount fat32 partition
    ansible.builtin.mount: >
      name=/mnt/usbdrive
      src='LABEL=ICPC'
      fstype=vfat
      opts="defaults,uid=contestant,gid=contestant"
      state=present

- name: write the homepage to a file so we can make sure access works in the self_test
  copy:
    dest: /icpc/config_homepage
    content: |
      {{ firefox_policies.Homepage.URL }}





# MOVE THIS TO A DIFFERENT PLAYBOOK
# install dbus-x11, xinit
- name: Install tools so we can do a gui initial setup wizard
  ansible.builtin.apt:
    state: present
    pkg:
      - dbus-x11
      - xinit

- name: Make sure the directory structure exists
  file:
    dest: /root/setup/{{item}}
    state: directory
  with_items:
    - .config
    - .config/autostart

- name: create xinitrc file
  copy:
    dest: /root/setup/.xinitrc
    content: |
      xset s off
      xset s noblank
      xset s off -dpms
      exec dbus-launch startxfce4

- name: Disable creating user dirs
  copy:
    dest: /root/setup/.config/user-dirs.conf
    content: |
      enabled=False

- name: create firstboot-gui script
  ansible.builtin.copy:
    content: |
      #!/bin/bash
      # exit cleanly if /icpc/setup-complete already exists
      if [ -f /icpc/setup-complete ]; then
        exit 0
      fi
      startx -- :0 -nolisten tcp
    dest: /icpc/scripts/firstboot-gui
    mode: 0744

- name: Create the systemd service that will run the setup
  copy:
    dest: /etc/systemd/system/firstboot.service
    content: |
      [Unit]
      Description=Initial configuration of the image
      Before=lightdm.service
      After=cups.service

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      TimeoutSec=0
      Environment=HOME=/root/setup
      Environment=XDG_CONFIG_HOME=/root/setup/.config
      ExecStart=/icpc/scripts/firstboot-gui

      [Install]
      WantedBy=graphical.target
      WantedBy=multi-user.target

- name: enable firstboot service
  service: name=firstboot enabled=yes

- name: create autostart file to run icpc-setup
  copy:
    dest: /root/setup/.config/autostart/icpc-setup.desktop
    mode: 0755
    content: |
      [Desktop Entry]
      Type=Application
      Name=ICPC Setup
      Exec=xfce4-terminal --maximize --hold --execute bash -c "/icpc/scripts/venv/bin/python3 /icpc/scripts/icpc_setup"
      Terminal=false
      StartupNotify=false
      NoDisplay=true

# need to install python3-pip and python3-venv
# then pip install freesimplegui into a virtualenv (maybe with python3 -m venv --system-site-packages venv-path)
# and an apt install python3-tk
- name: Install tools so we can do a gui initial setup wizard
  apt:
    state: present
    pkg:
      - python3-pip
      - python3-venv
      - python3-tk
- name: create a virtualenv for freesimplegui
  command: python3 -m venv --system-site-packages /icpc/scripts/venv
  args:
    creates: /icpc/scripts/venv
- name: Install freesimplegui
  pip:
    name: freesimplegui
    executable: /icpc/scripts/venv/bin/pip
- name: install new icpc_setup script (gui based!)
  copy:
    dest: /icpc/scripts/icpc_setup
    src: setup-gui/main.py
    mode: 0755
