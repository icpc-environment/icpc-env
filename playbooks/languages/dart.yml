---
- name: install dart repo key
  ansible.builtin.get_url:
    url: https://dl-ssl.google.com/linux/linux_signing_key.pub
    dest: /etc/apt/keyrings/dart.asc

- name: install dart repo
  ansible.builtin.deb822_repository:
    name: google-dart
    types: deb
    uris: https://storage.googleapis.com/download.dartlang.org/linux/debian
    suites: stable
    components: main
    architectures: amd64
    signed_by: /etc/apt/keyrings/dart.asc

- name: install dart
  ansible.builtin.apt:
    pkg: dart
    state: present
    update_cache: true
