---
- name: java openjdk
  apt:
    state: present
    pkg:
      - openjdk-21-jdk
      - openjdk-21-source

- name: register docs
  when: not devdocs
  block:
    - name: java openjdk docs
      apt:
        state: present
        pkg:
          - openjdk-21-doc
    - ansible.utils.update_fact:
        updates:
          - path: "lang_docs['Java']"
            value:
              name: Java API Documentation
              id: java_api
              path: /usr/share/doc/openjdk-21-doc/api
              index: index.html
      register: updated
    - set_fact:
        lang_docs: "{{ updated.lang_docs }}"
