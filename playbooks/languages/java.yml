---
- name: Install java openjdk
  ansible.builtin.apt:
    state: present
    pkg:
      - openjdk-{{ java_version }}-jdk
      - openjdk-{{ java_version }}-source   # 46 mb

- name: Register docs
  when: not devdocs
  block:
    - name: Java openjdk docs
      ansible.builtin.apt:
        state: present
        pkg:
          - openjdk-{{ java_version }}-doc   # 17 mb
    - ansible.utils.update_fact:
        updates:
          - path: "lang_docs['Java']"
            value:
              name: Java API Documentation
              id: java_api
              path: /usr/share/doc/openjdk-{{ java_version }}-doc/api
              index: index.html
      register: updated
    - set_fact:
        lang_docs: "{{ updated.lang_docs }}"
