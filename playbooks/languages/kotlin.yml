---
- name: install unzip so we can extract kotlin
  ansible.builtin.apt:
    pkg: unzip
    state: present
# Fetched at build time rather than shipped in files/, so kotlin_version is the
# only thing that needs changing to move versions.
- name: Download the kotlin compiler
  ansible.builtin.get_url:
    url: https://github.com/JetBrains/kotlin/releases/download/v{{ kotlin_version }}/kotlin-compiler-{{ kotlin_version }}.zip
    dest: /tmp/kotlin-compiler-{{ kotlin_version }}.zip
    mode: "0644"
- name: Install kotlin
  ansible.builtin.unarchive:
    src: /tmp/kotlin-compiler-{{ kotlin_version }}.zip
    dest: /opt
    remote_src: true
    creates: /opt/kotlinc
- name: create symlinks for kotlin
  file:
    src: /opt/kotlinc/bin/{{ binary_name }}
    dest: /usr/local/bin/{{ binary_name }}
    state: link
  loop_control:
    loop_var: binary_name
  with_items:
    - kapt
    - kotlin
    - kotlinc
    - kotlinc-js
    - kotlinc-jvm

- name: kotlin docs
  when: not devdocs
  block:
    # kotlin pdf doc (single file)
    - name: create directory for kotlin docs
      file:
        state: directory
        mode: '0755'
        path: /opt/kotlin-docs

    - name: fetch kotlin pdf
      get_url:
        url: https://kotlinlang.org/docs/kotlin-reference.pdf
        dest: /opt/kotlin-docs/kotlin-reference.pdf
        mode: '0644'
    - ansible.utils.update_fact:
        updates:
          - path: "lang_docs['Kotlin']"
            value:
              name: Kotlin PDF
              id: kotlin
              path: /opt/kotlin-docs
              index: kotlin-reference.pdf
      register: updated
    - set_fact:
        lang_docs: "{{ updated.lang_docs }}"
