---
- name: Python 3
  apt:
    state: present
    pkg:
      - python3
      # - pypy3
      - python-is-python3

# Fetch pypy3 manually so that we match the kattis version
- name: Download and extract pypy3
  unarchive:
    src: https://downloads.python.org/pypy/pypy3.10-v7.3.16-linux64.tar.bz2
    dest: /opt
    remote_src: yes
    creates: /opt/pypy3.10-v7.3.16-linux64
- name: Create symlinks for it
  file:
    src: /opt/pypy3.10-v7.3.16-linux64/bin/{{ item }}
    dest: /usr/local/bin/{{ item }}
    state: link
  with_items:
    - pypy3
    - pypy3.10

- name: ipython
  apt:
    state: present
    install_recommends: false # it's like 500MB with recommends vs 14MB without
    pkg:
      - ipython3

# TODO: it'd be neat to get the pypy docs
# https://docs.pypy.org/en/latest
# it's a readthedocs site, but doesn't have any downloads :(
# https://readthedocs.org/projects/pypy/downloads/

- name: python3 docs
  when: not devdocs
  block:
    - name: Python 3 docs
      apt:
        state: present
        pkg:
          - python3-doc     # 37.2 mb
          - pypy3-doc # 5mb
    - ansible.utils.update_fact:
        updates:
          - path: "lang_docs['Python 3']"
            value:
              name: Python 3 Documentation
              id: py3
              path: /usr/share/doc/python3-doc/html
              index: index.html
          - path: "lang_docs['PyPy 3']"
            value:
              name: PyPy3 Documentation
              id: pypy3
              path: /usr/share/doc/pypy3-doc/html
              index: index.html
      register: updated
    - set_fact:
        lang_docs: "{{ updated.lang_docs }}"
