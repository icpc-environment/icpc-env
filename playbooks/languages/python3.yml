---
- name: Python 3
  ansible.builtin.apt:
    state: present
    pkg:
      - python3
      - python-is-python3

- name: Install pypy3 from distro packages
  when: pypy3_version|default("distribution") == "distribution"
  ansible.builtin.apt:
    state: present
    pkg:
    - pypy3
- name: Install pypy3 directly from upstream
  when: pypy3_version|default("distribution") != "distribution"
  block:
    - name: Download and extract pypy3
      ansible.builtin.unarchive:
        src: https://downloads.python.org/pypy/{{ pypy3_version }}-linux64.tar.bz2
        dest: /opt
        remote_src: yes
        creates: /opt/{{ pypy3_version }}-linux64
    - name: Create symlinks for it
      ansible.builtin.file:
        src: /opt/{{ pypy3_version }}-linux64/bin/{{ item }}
        dest: /usr/local/bin/{{ item }}
        state: link
      with_items:
        - pypy3
        # - pypy3.11 # TODO: do we want this?

- name: ipython
  ansible.builtin.apt:
    state: present
    install_recommends: false # it's like 500MB with recommends vs 14MB without
    pkg:
      - ipython3

# TODO: it'd be neat to get the pypy docs
# https://docs.pypy.org/en/latest
# it's a readthedocs site, but doesn't have any downloads :(
# https://readthedocs.org/projects/pypy/downloads/

- name: python3 docs
  when: not devdocs
  block:
    - name: Python 3 docs
      ansible.builtin.apt:
        state: present
        pkg:
          - python3-doc     # 37.2 mb
          - pypy3-doc # 5mb
    - ansible.utils.update_fact:
        updates:
          - path: "lang_docs['Python 3']"
            value:
              name: Python 3 Documentation
              id: py3
              path: /usr/share/doc/python3-doc/html
              index: index.html
          - path: "lang_docs['PyPy 3']"
            value:
              name: PyPy3 Documentation
              id: pypy3
              path: /usr/share/doc/pypy3-doc/html
              index: index.html
      register: updated
    - set_fact:
        lang_docs: "{{ updated.lang_docs }}"
