---
- name: Install vmtouch
  ansible.builtin.apt:
    pkg: vmtouch
    state: present

- name: Remove the old cache warming script
  ansible.builtin.file:
    path: /usr/local/bin/vmtouch
    state: absent

- name: Copy the cache warming script to the system
  ansible.builtin.copy:
    dest: /usr/local/sbin/warm-fs-cache
    mode: "0755"
    content: |
      #!/bin/bash
      # Read what contestants start first into the page cache, so opening it doesn't wait on the usb drive.
      # Only the parts each program reads at startup, not whole directories
      VMTOUCH="/usr/bin/vmtouch -ft"

      # VS Code, opening a C++ file
      $VMTOUCH /usr/share/code/{code,icudtl.dat,*.pak,*.bin,*.so*,locales/en-US.pak,bin}
      $VMTOUCH /usr/share/code/resources/app/{out,node_modules.asar,*.json}
      $VMTOUCH /opt/vscode/extensions/ms-vscode.cpptools-*/{bin,dist,package*.json}
      # cpptools runs the compiler to find its include paths and defines
      $VMTOUCH /usr/libexec/gcc/x86_64-linux-gnu/*/{cc1,cc1plus} /usr/include

      # Firefox reads nearly all of it
      $VMTOUCH /usr/lib/firefox

      $VMTOUCH /usr/bin/{bash,ls,gcc,g++,as,ld,make,gdb,python3} /icpc

- name: Create a service to run it on boot
  ansible.builtin.copy:
    content: |
      [Unit]
      Description=Warm up file system cache

      [Service]
      # exec rather than oneshot, so multi-user.target doesn't wait for it
      Type=exec
      ExecStart=/usr/local/sbin/warm-fs-cache
      Nice=19
      IOSchedulingClass=idle

      [Install]
      WantedBy=multi-user.target
    dest: /etc/systemd/system/warm-fs-cache.service

- name: Enable warm-fs-cache service
  ansible.builtin.service:
    name: warm-fs-cache
    enabled: true
