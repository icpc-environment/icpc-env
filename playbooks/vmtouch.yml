---
- name: Install vmtouch
  ansible.builtin.apt:
    pkg: vmtouch
    state: present

- name: Copy vmtouch script to the system
  ansible.builtin.copy:
    dest: /usr/local/bin/vmtouch
    mode: "0755"
    content: |
      #!/bin/bash
      # Load some useful things into the kernels cache
      VMTOUCH="/usr/bin/vmtouch -ft"

      $VMTOUCH /opt/eclipse # 251M
      $VMTOUCH /usr/lib/jvm # 312M
      $VMTOUCH /usr/include #  33M

      # If we have more than 5 Gb of memory, cache some other stuff
      phymem=$(awk '/MemTotal/{print $2}' /proc/meminfo)
      if  [ "$phymem" -gt "5000000" ]; then
          $VMTOUCH /lib         # 229M
          $VMTOUCH /usr/lib     #   2G
          $VMTOUCH /opt/intellij-idea-community # 968M
      fi

      # Do these last to make sure they end up in memory
      $VMTOUCH /icpc     # 250K
      $VMTOUCH /bin      # 12M
      $VMTOUCH /usr/bin  # 365M


- name: Create a service to run it on boot
  ansible.builtin.copy:
    content: |
      [Unit]
      Description=Warm up file system cache

      [Service]
      Type=oneshot
      ExecStart=/usr/bin/nice -n 19 /usr/bin/find / -path /proc -prune -o -path /sys -prune
      ExecStart=/usr/bin/nice -n 19 /icpc/scripts/vmtouch.sh

      [Install]
      WantedBy=multi-user.target
    dest: /etc/systemd/system/warm-fs-cache.service

- name: Enable warm-fs-cache service
  ansible.builtin.service:
    name: warm-fs-cache
    enabled: true
