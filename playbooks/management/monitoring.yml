---
- name: Install node-exporter
  ansible.builtin.apt:
    state: present
    pkg:
      - prometheus-node-exporter
      - moreutils # so we can use sponge when writing some custom metrics information

# The collectors package recommends ipmitool, which recommends openipmi. These are desktops with no BMC
- name: Remove ipmitool and openipmi
  ansible.builtin.apt:
    state: absent
    pkg:
      - ipmitool
      - openipmi

- name: Drop a configuration file for node exporter to disable systemd metrics (it's noisy/slowish)
  ansible.builtin.copy:
    dest: /etc/default/prometheus-node-exporter
    mode: "0644"
    content: ARGS="--no-collector.systemd"
#       --collector.disable-defaults
#       --collector.arp
#       --collector.bcache
#       --collector.bonding
# #     --collector.btrfs
#       --collector.conntrack
#       --collector.cpu
#       --collector.cpufreq
#       --collector.diskstats
# #      --collector.dmi
#       --collector.edac
#       --collector.entropy
# #      --collector.exec
# #      --collector.fiberchannel
#       --collector.filefd
#       --collector.filesystem
#       --collector.hwmon
#       --collector.infiniband
#       --collector.ipvs
#       --collector.loadavg
#       --collector.mdadm
#       --collector.meminfo
#       --collector.netclass
#       --collector.netdev
#       --collector.netstat
#       --collector.nfs
#       --collector.nfsd
# #      --collector.nvme
# #      --collector.os
# #      --collector.powersupplyclass
#       --collector.pressure
# #      --collector.rapl
# #      --collector.schedstat
#       --collector.sockstat
# #      --collector.softnet
#       --collector.stat
#       --collector.systemd
# #      --collector.tapestats
#       --collector.textfile
#       --collector.textfile.directory /var/lib/prometheus/node-exporter
# #      --collector.thermal
# #      --collector.thermal_zone
#       --collector.time
#       --collector.timex
# #      --collector.udp_queues
#       --collector.uname
#       --collector.vmstat
#       --collector.xfs
#       --collector.zfs

- name: Disable some timers that come with node-exporter that we don't want
  ansible.builtin.service:
    name: "{{ item }}"
    enabled: false
  with_items:
    - prometheus-node-exporter-smartmon.timer
    - prometheus-node-exporter-apt.timer
    # These are configured, but inactive (conditional false)
    - prometheus-node-exporter-ipmitool-sensor.timer    # inactive because no /usr/bin/ipmitool binary (and /sys/class/ipmi empty)
    - prometheus-node-exporter-mellanox-hca-temp.timer  # inactive because no /usr/bin/mget_temp_ext binary (and /sys/class/infiniband missing)

- name: Override node-exporter to run nice'd/idle/low io+cpu priority
  block:
    - name: Create override directory
      ansible.builtin.file:
        path: /etc/systemd/system/prometheus-node-exporter.service.d
        state: directory
        mode: "0755"
    - name: Create override file
      ansible.builtin.copy:
        dest: /etc/systemd/system/prometheus-node-exporter.service.d/override.conf
        content: |
          [Service]
          CPUSchedulingPolicy=other
          Nice=19
          IOSchedulingClass=idle
        mode: "0644"

- name: Restart node-exporter
  ansible.builtin.service:
    name: prometheus-node-exporter
    state: started
    enabled: true

# add some custom "metrics" like roles/sites/etc
- name: Install our custom icpc-metrics script
  ansible.builtin.copy:
    src: files/icpc-metrics
    dest: /usr/local/bin/icpc-metrics
    mode: "0755"
- name: Static metrics exporter
  ansible.builtin.copy:
    dest: /etc/systemd/system/icpc-static-node-exporter.service
    mode: "0644"
    content: |
      [Unit]
      Description=Update static node-exporter metrics with icpc things
      After=network.target

      [Service]
      Restart=on-failure
      RestartSec=30
      Type=oneshot
      ExecStart=/usr/local/bin/icpc-metrics

      [Install]
      WantedBy=multi-user.target

- name: Enable icpc-static-node-exporter.service
  ansible.builtin.service:
    name: icpc-static-node-exporter.service
    enabled: true

- name: Static metric trigger
  ansible.builtin.copy:
    dest: /etc/systemd/system/icpc-static-node-exporter.path
    mode: "0644"
    content: |
      # trigger metrics update whenever the config/version/update-version change so we can update the values in prometheus
      [Path]
      PathModified=/icpc/config.json
      PathModified=/icpc/version
      PathModified=/icpc/update-version
      PathModified=/icpc/team-reset-complete

      [Install]
      WantedBy=multi-user.target

- name: Enable icpc-static-node-exporter.path
  ansible.builtin.service:
    name: icpc-static-node-exporter.path
    enabled: true

# revisions and printouts, which change too often for the path unit above
- name: Install our icpc-contest-metrics script
  ansible.builtin.copy:
    src: files/icpc-contest-metrics
    dest: /usr/local/bin/icpc-contest-metrics
    mode: "0755"
- name: Contest metrics exporter
  ansible.builtin.copy:
    dest: /etc/systemd/system/icpc-contest-metrics.service
    mode: "0644"
    content: |
      [Unit]
      Description=Publish revisions and printouts to node_exporter

      [Service]
      Type=oneshot
      Nice=19
      IOSchedulingClass=idle
      ExecStart=/usr/local/bin/icpc-contest-metrics

- name: Contest metrics timer
  ansible.builtin.copy:
    dest: /etc/systemd/system/icpc-contest-metrics.timer
    mode: "0644"
    content: |
      [Unit]
      Description=Publish revisions and printouts to node_exporter

      [Timer]
      OnActiveSec=5s
      OnUnitActiveSec=1min
      AccuracySec=5s

      [Install]
      WantedBy=timers.target

- name: Enable icpc-contest-metrics.timer
  ansible.builtin.service:
    name: icpc-contest-metrics.timer
    enabled: true

- name: Install s.py script
  ansible.builtin.copy:
    src: files/s.py
    dest: /usr/local/bin/s.py
    mode: "0755"

- name: Install python3-xlib for s.py library
  ansible.builtin.apt:
    state: present
    pkg: python3-xlib

- name: Foreground window tracker service
  ansible.builtin.copy:
    dest: /etc/systemd/system/icpc-focus-log.service
    mode: "0644"
    content: |
      [Unit]
      Description=Log which application has the foreground window

      [Service]
      Environment=DISPLAY=:0 XAUTHORITY=/var/run/lightdm/root/:0
      ExecStart=/usr/local/bin/s.py /run/icpc-focus/focus.jsonl
      RuntimeDirectory=icpc-focus
      RuntimeDirectoryMode=0700
      RuntimeDirectoryPreserve=yes
      UMask=0077
      Restart=always
      RestartSec=30
      Nice=19

      [Install]
      WantedBy=graphical.target

- name: Enable icpc-focus-log.service
  ansible.builtin.service:
    name: icpc-focus-log.service
    enabled: true

- name: Install auditd
  ansible.builtin.apt:
    state: present
    pkg: auditd

- name: Keep the audit log in RAM, not on the USB flash drive
  # auditd records every contestant execve continuously - a steady write
  # stream. icpc-backup ships it to the management server with each backup,
  # so volatile is fine.
  # size= is only a cap (tmpfs allocates on use), so the headroom over
  # auditd's 200MB retention costs no RAM but keeps free space above
  # auditd's stock space_left/admin_space_left thresholds (75/50MB) - below
  # those it would warn and then SUSPEND logging instead of just rotating.
  ansible.posix.mount:
    path: /var/log/audit
    src: tmpfs
    fstype: tmpfs
    opts: size=512m,mode=0750
    state: mounted

- name: Bound the audit logs so they rotate rather than fill the tmpfs
  ansible.builtin.lineinfile:
    path: /etc/audit/auditd.conf
    regexp: '^{{ item.key }} ='
    line: '{{ item.key }} = {{ item.value }}'
  loop:
    - { key: max_log_file, value: 20 }   # MB per file
    - { key: num_logs, value: 10 }       # 20 x 10 = 200MB retention, well under 512MB
  register: auditd_conf

- name: Audit every program the contestant runs
  ansible.builtin.copy:
    dest: /etc/audit/rules.d/icpc-contestant.rules
    mode: "0640"
    content: |
      # Search with: ausearch --input-logs -k contestant-exec -i
      -a always,exit -F arch=b64 -S execve,execveat -F uid=contestant -k contestant-exec
      -a always,exit -F arch=b32 -S execve,execveat -F uid=contestant -k contestant-exec
  register: audit_rules

- name: Restart auditd
  ansible.builtin.service:
    name: auditd
    state: restarted
    enabled: true
  when: auditd_conf.changed

- name: Load the audit rules
  ansible.builtin.service:
    name: audit-rules
    state: restarted
    enabled: true
  when: audit_rules.changed


# TODO: ship logs to the management server with grafana alloy.
# promtail used to live here, but it was only ever installed - no config file
# and no service - and grafana ended promtail support in early 2026. Alloy is
# the replacement; it needs its own apt repo and a config before it goes back
# in. Dropping promtail also drops the apt.grafana.com repo, which was being
# left behind in the shipped image.
