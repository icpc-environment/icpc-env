---
# install ansible, configure ansible-pull to run on boot
- name: Install ansible (for ansible-pull)
  ansible.builtin.apt:
    pkg: ansible
    state: present

- name: Copy ansible-pull.service
  ansible.builtin.copy:
    content: |
      [Unit]
      Description=Execute ansible-pull to do any last minute changes to the system
      After=network-online.target
      Wants=network-online.target

      [Service]
      Restart=on-failure
      RestartSec=30
      Type=oneshot
      EnvironmentFile=/icpc/CONFIG
      ExecStart=/usr/bin/ansible-pull \
        --directory /root/ansible-pull \
        --sleep 30 \
        --clean \
        --diff \
        --inventory localhost, \
        --url ${ANSIBLE_PULL_URL}

      [Install]
      WantedBy=multi-user.target
    dest: /etc/systemd/system/ansible-pull.service
    mode: "0644"

- name: Add ansible-pull.path (triggers on /icpc/trigger-ansible existing)
  ansible.builtin.copy:
    content: |
      # trigger ansible-pull service if the file /icpc/trigger-update is modified
      # ansible should delete the file when it runs successfully
      [Path]
      PathExists=/icpc/trigger-ansible

      [Install]
      WantedBy=multi-user.target
    dest: /etc/systemd/system/ansible-pull.path
    mode: "0644"
