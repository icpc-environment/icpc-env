- name: Remove packages we don't want present
  ansible.builtin.package:
    pkg:
      - command-not-found
      - bluez
      - bluez-obexd
      - apport
      - avahi-daemon
      - ufw
    state: absent

- name: Cleanup command-not-found dir
  ansible.builtin.file:
    path: /var/lib/command-not-found
    state: absent

- name: Update packages
  ansible.builtin.apt:
    name: "*"
    state: latest  # noqa: package-latest
    update_cache: true
    force_apt_get: true

- name: Configure netplan to use NetworkManager (and remove all other configs)
  ansible.builtin.copy:
    dest: /etc/netplan/01-netcfg.yaml
    content: |
      network:
        version: 2
        renderer: NetworkManager

- name: Tell NetworkManager to ignore VPN related devices
  ansible.builtin.copy:
    dest: /etc/NetworkManager/conf.d/10-globally-managed-devices.conf
    content: |
      [keyfile]
      unmanaged-devices=type:wireguard,type:tun,type:bridge,type:veth

- name: Disable systemd-networkd so that it uses networkmanager instead
  ansible.builtin.service:
    name: "{{ item }}"
    masked: true
    enabled: no
  with_items:
    - systemd-networkd
    - systemd-networkd.socket

- name: Disable console blanking
  ansible.builtin.lineinfile:
    dest: /etc/default/grub
    regexp: "^GRUB_CMDLINE_LINUX_DEFAULT"
    line: 'GRUB_CMDLINE_LINUX_DEFAULT="biosdevname=0 consoleblank=0"'
    state: present
  notify: Update grub

- name: journald write to /dev/tty1
  ansible.builtin.copy:
    content: |
      [Journal]
      # no sense persisting logs to disk, we don't care about them that much
      Storage=volatile
      ForwardToSyslog=no
      ForwardToKMsg=no
      ForwardToConsole=yes
      ForwardToWall=no
      TTYPath=/dev/tty1
    dest: /etc/systemd/journald.conf

- name: systemd disable status messages on console
  ansible.builtin.copy:
    content: |
      [Manager]
      ShowStatus=false
    dest: /etc/systemd/system.conf

- name: Uninstall rsyslog package (to avoid the disk writes)
  ansible.builtin.apt:
    name: rsyslog
    state: absent
    autoremove: true
    purge: true

- name: Remove old log files
  ansible.builtin.file:
    path: /var/log/{{ item }}
    state: absent
  with_items:
    - syslog
    - kern.log
    - auth.log
    - dpkg.log
    - boot.log
    - apport.log

# TODO do we want this? (conditional on icpc repo)
- name: Disable unattended upgrades/apt cache fetching
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "0";
      APT::Periodic::Unattended-Upgrade "0";
    mode: "0644"
    owner: root
    group: root

