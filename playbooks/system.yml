---
- name: Useful packages for admins
  ansible.builtin.package:
    name:
      - alsa-utils
      # performance tools
      - htop
      - btop        # a modern resource monitor
      - dstat
      - iotop
      - sysstat
      - dstat
      # misc admin tools
      - util-linux-extra  # for hwclock
      - net-tools   # for ifconfig/old tools
      - curl        # debugging connection things
      - ncdu
      - jc          # for json output form various commands
      - jq
      - shellcheck
      # Needed for wifi
      - network-manager
      - network-manager-gnome
      - wpasupplicant
      - iw
      # For sites that run this as VM
      - open-vm-tools
    install_recommends: false

- name: Disable ssh socket based listening
  ansible.builtin.systemd_service:
    name: ssh.socket
    state: stopped
    enabled: false
- name: Ensure ssh service is enabled and started (not socket activated)
  ansible.builtin.systemd_service:
    name: ssh.service
    state: started
    enabled: true

# - name: Disable ipv6
#   ansible.builtin.lineinfile:
#     dest: /etc/default/grub
#     regexp: "^GRUB_CMDLINE_LINUX="
#     line: 'GRUB_CMDLINE_LINUX="ipv6.disable=1 net.ifnames=0"'
#     state: present
#   notify: Update grub

- name: Ensure appport & avahi-daemon are not installed
  ansible.builtin.package:
    pkg:
      - apport
      - avahi-daemon
    state: absent

- name: Update packages
  ansible.builtin.apt:
    name: "*"
    state: latest  # noqa: package-latest
    update_cache: true
    force_apt_get: true


- name: Configure netplan to use NetworkManager (and remove all other configs)
  ansible.builtin.copy:
    dest: /etc/netplan/01-netcfg.yaml
    content: |
      network:
        version: 2
        renderer: NetworkManager

- name: tell networkmanager to and ignore vpn related devices
  ansible.builtin.copy:
    dest: /etc/NetworkManager/conf.d/10-globally-managed-devices.conf
    content: |
      [keyfile]
      unmanaged-devices=type:wireguard,type:tun,type:bridge,type:veth

- name: disable systemd-networkd so that it uses networkmanager instead
  ansible.builtin.service:
    name: "{{ item }}"
    masked: yes
    enabled: no
  with_items:
    - systemd-networkd
    - systemd-networkd.socket

- name: Don't let the contestant user mess with any network settings
  ansible.builtin.copy:
    dest: /etc/polkit-1/rules.d/99-deny-networkmanager.rules
    content: |
      polkit.addRule(function(action, subject) {
          if (action.id.startsWith("org.freedesktop.NetworkManager.") &&
              subject.user == "contestant")
          {
              return polkit.Result.NO;
              // return polkit.Result.AUTH_ADMIN; // If we want to allow prompting to auth as admin to do networkmanager related things form the contestant session
          }
      });

- name: disable console blanking
  ansible.builtin.lineinfile:
    dest: /etc/default/grub
    regexp: "^GRUB_CMDLINE_LINUX_DEFAULT"
    line: 'GRUB_CMDLINE_LINUX_DEFAULT="biosdevname=0 consoleblank=0"'
    state: present
  notify: update grub

- name: journald write to /dev/tty1
  ansible.builtin.copy:
    content: |
      [Journal]
      Storage=volatile # no sense persisting logs to disk, we don't care about them that much
      ForwardToSyslog=no
      ForwardToKMsg=no
      ForwardToConsole=yes
      ForwardToWall=no
      TTYPath=/dev/tty1
    dest: /etc/systemd/journald.conf

- name: systemd disable status messages on console
  ansible.builtin.copy:
    content: |
      [Manager]
      ShowStatus=false
    dest: /etc/systemd/system.conf

- name: disable avahi-daemon (and socket), because we don't need mDNS
  ansible.builtin.service:
    name: "{{ item }}"
    state: stopped
    enabled: no
  with_items:
    - avahi-daemon.socket
    - avahi-daemon.service


# TODO do we want this? (conditional on icpc repo)
- name: Disable unattended upgrades/apt cache fetching
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "0";
      APT::Periodic::Unattended-Upgrade "0";
    mode: "0644"
    owner: root
    group: root

- name: Configure firefox policies
  ansible.builtin.copy:
    dest: /usr/lib/firefox/distribution/policies.json
    content: |
      {
        "policies":
        {{ firefox_default_policies | combine(firefox_policies) | to_nice_json }}
      }
    mode: "0644"
    owner: root
    group: root

