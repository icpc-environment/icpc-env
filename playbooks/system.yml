---
- name: Useful packages for admins
  ansible.builtin.package:
    name:
      - alsa-utils
      # performance tools
      - htop
      - btop        # a modern resource monitor
      - dstat
      - iotop
      - sysstat
      # misc admin tools
      - util-linux-extra  # for hwclock
      - net-tools   # for ifconfig/old tools
      - curl        # debugging connection things
      - ncdu
      - jc          # for json output form various commands
      - jq
      - shellcheck
      # Needed for wifi
      - network-manager
      - network-manager-gnome
      - wpasupplicant
      - iw
      # More reliable clock (systemd-timesyncd is not good)
      - chrony
      # For sites that run this as VM
      - open-vm-tools
    install_recommends: false

- name: Disable ssh socket based listening
  ansible.builtin.systemd_service:
    name: ssh.socket
    state: stopped
    enabled: false
- name: Ensure ssh service is enabled and started (not socket activated)
  ansible.builtin.systemd_service:
    name: ssh.service
    state: started
    enabled: true

# - name: Disable ipv6
