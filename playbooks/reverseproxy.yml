---
- name: Install nginx
  ansible.builtin.apt:
    pkg:
      - nginx
      - ssl-cert # for the snakeoil stuff
      - dnsmasq # for local dns resolver
    state: present

- name: Remove default nginx configuration
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx

