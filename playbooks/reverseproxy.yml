---
- name: install nginx
  ansible.builtin.apt:
    pkg:
      - nginx
      - ssl-cert # for the snakeoil stuff
    state: present

- name: remove default nginx configuration
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: reload nginx

# - name: install the ssl data
#   ansible.builtin.copy:
#     content: "{{ item.content }}"
#     dest: /etc/ssl/{{ item.dest }}
#     mode: "{{ item.mode }}"
#   notify: reload nginx
#   loop:
#     - { content: "{{ reverseproxy_key }}", dest: reverseproxy.key, mode: "0600" }
#     - { content: "{{ reverseproxy_cert }}", dest: reverseproxy.cert, mode: "0644" }

- name: use the snakeoil cert, since squid will be proxying everything and mitms things/accepts any certificate
  ansible.builtin.copy:
    remote_src: true
    src: /etc/ssl/{{item.src}}
    dest: /etc/ssl/{{item.dest}}
    mode: "{{ item.mode }}"
  notify: reload nginx
  loop:
    - { src: "private/ssl-cert-snakeoil.key", dest: reverseproxy.key, mode: "0600" }
    - { src: "certs/ssl-cert-snakeoil.pem", dest: reverseproxy.cert, mode: "0644" }

- name: make sure web dir exists
  file: state=directory path=/opt/localwww

- name: install our reverse proxy config
  ansible.builtin.template:
    src: files/nginx.conf.j2
    dest: /etc/nginx/sites-available/reverseproxy.conf
    mode: 0644
    owner: root
    group: root
    lstrip_blocks: true
    trim_blocks: true
  notify: reload nginx

- name: enable the reverseproxy nginx config
  ansible.builtin.file:
    src: /etc/nginx/sites-available/reverseproxy.conf
    dest: /etc/nginx/sites-enabled/reverseproxy
    state: link
  notify: reload nginx

- name: update hosts file so we talk to the proxyserver instead of the real server
  ansible.builtin.lineinfile:
    path: /etc/hosts
    line: "127.0.0.1	{{ item }}"
    owner: root
    group: root
    mode: '0644'
  loop: "{{ reverseproxy_sites.keys() }}"

- name: update hosts file so devdocs is available properly
  ansible.builtin.lineinfile:
    path: /etc/hosts
    line: "127.0.0.1	devdocs"
    owner: root
    group: root
    mode: '0644'

# This is so we don't have to hardcode `resolver 8.8.8.8` in the nginx config, and can use whatever dns networkmanager discovered
# This is needed on networks that filter dns requests to only allow their dns servers
- name: Configure dnsmasq to use the systemd resolver file
  ansible.builtin.copy:
    dest: /etc/dnsmasq.conf
    content: |
      listen-address=127.0.0.55
      port=53
      bind-interfaces
      keep-in-foreground
      no-hosts # don't read /etc/hosts
      resolv-file=/run/systemd/resolve/resolv.conf

- name: create a dnsmasq systemd service
  ansible.builtin.copy:
    dest: /etc/systemd/system/dnsmasq.service
    content: |
      [Unit]
      Description=Local dns resolver that ignores /etc/hosts
      After=network.target

      [Service]
      ExecStart=/usr/sbin/dnsmasq -k --conf-file=/etc/dnsmasq.conf
      ExecReload=/bin/kill -HUP $MAINPID
      Restart=on-failure
      RestartSec=5

      [Install]
      WantedBy=multi-user.target

- name: Enable + start dnsmasq
  ansible.builtin.systemd:
    name: dnsmasq
    enabled: true
    state: started
