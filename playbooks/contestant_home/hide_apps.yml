---
- name: Ensure .local/share/applications directory exists in skel
  ansible.builtin.file:
    path: /etc/skel/.local/share/applications
    state: directory
- name: Create .desktop files to hide unwanted apps from the menu
  ansible.builtin.copy:
    mode: "0644"
    dest: /etc/skel/.local/share/applications/{{ item }}.desktop
    content: |
      [Desktop Entry]
      Type=Application
      NoDisplay=true
      Hidden=true
  loop:
    - xfce4-about
    - display-im6.q16 # imagemagick
