---
# TODO; this seems to be ignored?
- name: Create user-dirs.dirs to avoid creating Pictures/Music/Videos in the home directory
  ansible.builtin.copy:
    mode: "0644"
    dest: /etc/skel/.config/user-dirs.dirs
    content: |
      # This is to avoid creating a bunch of directories in the home dir
      # Setting them to "$HOME/" prevents them being created
      XDG_DESKTOP_DIR="$HOME/Desktop"
      XDG_DOWNLOAD_DIR="$HOME/Downloads"
      XDG_TEMPLATES_DIR="$HOME/"
      XDG_PUBLICSHARE_DIR="$HOME/"
      XDG_DOCUMENTS_DIR="$HOME/"
      XDG_MUSIC_DIR="$HOME/"
      XDG_PICTURES_DIR="$HOME/"
      XDG_VIDEOS_DIR="$HOME/"
- name: Also set the locale
  ansible.builtin.copy:
    mode: "0644"
    dest: /etc/skel/.config/user-dirs.locale
    content: |
      en_US
