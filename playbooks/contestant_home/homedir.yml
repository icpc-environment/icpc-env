---
# Populate /etc/skel so the contestant home directory has the correct content
- name: Ensure /etc/skel directory exists
  file:
    path: /etc/skel/{{ item }}
    state: directory
  loop:
    - Desktop
    - .config/autostart
    - .config/menus

- import_tasks: autostart_firefox.yml
- import_tasks: firstlogin.yml
- import_tasks: hide_apps.yml
- import_tasks: user-dirs.yml


- name: Create a script to mark all desktop files as trusted
  ansible.builtin.copy:
    dest: /usr/local/bin/trust-desktop-shortcuts
    mode: '0755'
    content: |
      #!/bin/bash
      for f in ~/Desktop/*.desktop
      do
        if ! gio info "$f" | grep metadata::xfce-exe-checksum > /dev/null 2>&1; then
            chmod +x "$f"
            gio set -t string "$f" metadata::xfce-exe-checksum "$(sha256sum "$f" | awk '{print $1}')"
        fi
      done
      exit 0
- name: Add autostart script to trust desktop shortcuts
  ansible.builtin.copy:
    dest: /etc/xdg/autostart/trust-desktop-shortcuts.desktop
    content: |
      [Desktop Entry]
      Type=Application
      Exec=/usr/local/bin/trust-desktop-shortcuts
      NoDisplay=true
    mode: "0755"
    owner: "root"
    group: "root"


- name: Add shortcuts on the desktop for various applications
  ansible.builtin.copy:
    src: "/usr/share/applications/{{ item }}"
    dest: "/etc/skel/Desktop/{{ item }}"
    owner: root
    group: root
    mode: '0755'
    remote_src: true
  loop:
    - 'firefox.desktop'
    - 'xfce4-terminal.desktop'
    # - 'clion.desktop'
    # - 'com.microsoft.VSCode.desktop'
    # - 'Eclipse.desktop'
    # - 'emacs.desktop'
    # - 'gedit.desktop'
    # - 'gvim.desktop'
    # - 'intellij.desktop'
    # - 'pycharm-community.desktop'


- name: Configure xfdesktop
  copy:
    dest: /etc/xdg/xfce4/xfconf/xfce-perchannel-xml/xfce4-desktop.xml
    content: |
      <?xml version="1.0" encoding="UTF-8"?>
      <channel name="xfce4-desktop" version="1.0">
        <property name="desktop-icons" type="empty">
          <property name="style" type="empty"/>
          <property name="file-icons" type="empty">
            <property name="show-home" type="empty"/>
            <property name="show-filesystem" type="bool" value="false"/>
            <property name="show-removable" type="bool" value="false"/>
            <property name="show-trash" type="bool" value="true"/>
            <property name="show-network-removable" type="bool" value="false"/>
            <property name="show-unknown-removable" type="bool" value="false"/>
          </property>
        </property>
        <property name="backdrop" type="empty">
          <property name="screen0" type="empty">
            <property name="monitor0" type="empty">
              <property name="image-path" type="string" value="/icpc/teamWallpaper.png"/>
              <property name="image-style" type="empty"/>
              <property name="image-show" type="empty"/>
            </property>
            <property name="monitor1" type="empty">
              <property name="image-path" type="empty"/>
              <property name="image-style" type="empty"/>
              <property name="image-show" type="empty"/>
            </property>
            <property name="monitorVGA-0" type="empty">
              <property name="workspace0" type="empty">
                <property name="color-style" type="int" value="0"/>
                <property name="image-style" type="int" value="5"/>
                <property name="last-image" type="string" value="/icpc/teamWallpaper.png"/>
              </property>
              <property name="workspace1" type="empty">
                <property name="color-style" type="int" value="0"/>
                <property name="image-style" type="int" value="5"/>
                <property name="last-image" type="string" value="/icpc/teamWallpaper.png"/>
              </property>
            </property>
          </property>
        </property>
      </channel>

- name: Configure panel
  copy:
    dest: /etc/xdg/xfce4/xfconf/xfce-perchannel-xml/xfce4-panel.xml
    content: |
      <?xml version="1.0" encoding="UTF-8"?>
      <channel name="xfce4-panel" version="1.0">
        <property name="panels" type="uint" value="1">
          <property name="panel-0" type="empty">
            <property name="position" type="string" value="p=6;x=0;y=0"/>
            <property name="length" type="uint" value="100"/>
            <property name="position-locked" type="bool" value="true"/>
            <property name="plugin-ids" type="array">
              <value type="int" value="1"/>
              <value type="int" value="2"/>
              <value type="int" value="3"/>
              <value type="int" value="8"/>
              <value type="int" value="10"/>
              <value type="int" value="5"/>
              <value type="int" value="4"/>
              <value type="int" value="11"/>
              <value type="int" value="6"/>
              <value type="int" value="7"/>
            </property>
            <property name="background-style" type="uint" value="0"/>
            <property name="background-alpha" type="uint" value="80"/>
            <property name="size" type="uint" value="24"/>
            <property name="length-adjust" type="bool" value="true"/>
            <property name="span-monitors" type="bool" value="false"/>
            <property name="enter-opacity" type="uint" value="100"/>
            <property name="leave-opacity" type="uint" value="100"/>
            <property name="mode" type="uint" value="0"/>
            <property name="autohide-behavior" type="uint" value="0"/>
          </property>
        </property>
        <property name="plugins" type="empty">
          <property name="plugin-2" type="string" value="tasklist">
            <property name="flat-buttons" type="bool" value="true"/>
          </property>
          <property name="plugin-3" type="string" value="separator">
            <property name="style" type="uint" value="0"/>
            <property name="expand" type="bool" value="true"/>
          </property>
          <property name="plugin-4" type="string" value="systray">
            <property name="show-frame" type="bool" value="false"/>
            <property name="size-max" type="uint" value="22"/>
            <property name="names-visible" type="array">
              <value type="string" value="thunar"/>
              <value type="string" value="ibus panel"/>
            </property>
            <property name="names-hidden" type="array">
            </property>
            <property name="known-items" type="array">
              <value type="string" value="nm-applet"/>
            </property>
          </property>
          <property name="plugin-6" type="string" value="separator">
            <property name="style" type="uint" value="0"/>
            <property name="expand" type="bool" value="false"/>
          </property>
          <property name="plugin-7" type="string" value="clock">
            <property name="digital-format" type="string" value="%a, %d %b %Y %I:%M %P %Z"/>
            <property name="timezone" type="string" value=""/>
            <property name="digital-time-format" type="string" value="%a, %d %b %Y %I:%M %P %Z"/>
            <property name="digital-layout" type="uint" value="3"/>
          </property>
          <property name="plugin-1" type="string" value="applicationsmenu">
            <property name="button-title" type="string" value="Applications"/>
            <property name="custom-menu" type="bool" value="false"/>
          </property>
          <property name="plugin-5" type="string" value="pager"/>
          <property name="plugin-8" type="string" value="genmon"/>
          <property name="plugin-10" type="string" value="separator">
            <property name="style" type="uint" value="0"/>
          </property>
          <property name="plugin-11" type="string" value="power-manager-plugin"/>
        </property>
        <property name="configver" type="int" value="2"/>
      </channel>

- name: Configure genmon (plugin id 8 in the panel config below)
  copy:
    dest: /etc/xdg/xfce4/panel/genmon-8.rc
    content: |
      Command=cat /icpc/TEAM
      UseLabel=0
      Text=(genmon)
      UpdatePeriod=30000
      Font=Sans 10

- name: Configure xfce power management
  copy:
    dest: /etc/xdg/{{ item }}/xfconf/xfce-perchannel-xml/xfce4-power-manager.xml
    content: |
      <?xml version="1.0" encoding="UTF-8"?>
      <channel name="xfce4-power-manager" version="1.0">
        <property name="xfce4-power-manager" type="empty">
          <property name="power-button-action" type="empty"/>
          <property name="show-tray-icon" type="empty"/>
          <property name="logind-handle-lid-switch" type="empty"/>
          <property name="dpms-enabled" type="bool" value="false"/>
          <!-- These values are controlled by gui.yml, in /usr/share/X11/xorg.conf.d/99-icpc-monitor.conf -->
          <property name="dpms-on-ac-sleep" type="uint" value="0"/>
          <property name="dpms-on-ac-off" type="uint" value="0"/>
          <property name="blank-on-ac" type="int" value="0"/>
        </property>
      </channel>
  loop:
    - xfce4
    - xdg-xubuntu/xfce4

- name: Configure xfce menus to hide a few things (like mail reader)
  copy:
    dest: /etc/skel/.config/menus/xfce-applications.menu
    content: |
      <?xml version="1.0" ?>
      <!DOCTYPE Menu
        PUBLIC '-//freedesktop//DTD Menu 1.0//EN'
        'http://standards.freedesktop.org/menu-spec/menu-1.0.dtd'>
      <Menu>
              <Name>Xfce</Name>
              <MergeFile type="parent">/etc/xdg/menus/xfce-applications.menu</MergeFile>
              <Exclude>
                      <Filename>xfce4-mail-reader.desktop</Filename>
              </Exclude>
              <AppDir>/home/contestant/.local/share/applications</AppDir>
      </Menu>


- name: Override XDG_CONFIG_DIR so that it uses /etc/xdg properly
  copy:
    dest: /etc/X11/Xsession.d/99-custom-xdg-config
    content: |
      # use the xfce defaults, not xubuntu defaults
      export XDG_CONFIG_DIRS="/etc/xdg/xfce4:/etc/xdg"
