---
# TODO: just set the wallpaper properly with xfce?
# System-wide rather than in the contestant's home, so icpc-apply turns it on
# and off (with Hidden=true) without touching files the contestant controls
- name: Create autostart entry for firefox
  ansible.builtin.copy:
    dest: /etc/xdg/autostart/icpc-firefox.desktop
    content: |
      [Desktop Entry]
      Version=1.0
      Name=Firefox
      Exec=bash -c '[[ "$USER" == "contestant" ]] && nohup firefox & sleep 15 && wmctrl -r :ACTIVE: -b add,maximized_vert,maximized_horz'
      Terminal=false
      Type=Application
      Icon=firefox
      StartupNotify=true
    mode: "0644"
    owner: "root"
    group: "root"

- name: Remove the old per-user firefox autostart entry from skel
  ansible.builtin.file:
    path: /etc/skel/.config/autostart/firefox.desktop
    state: absent
