---
- name: Create autostart entry for firefox
  ansible.builtin.copy:
    dest: /etc/skel/.config/autostart/firefox.desktop
    content: |
      [Desktop Entry]
      Version=1.0
      Name=Firefox
      Exec=bash -c '[[ "$USER" == "contestant" ]] && nohup firefox & sleep 15 && wmctrl -r :ACTIVE: -b add,maximized_vert,maximized_horz'
      Terminal=false
      Type=Application
      Icon=firefox
      StartupNotify=true
    mode: "0755"
    owner: "root"
    group: "root"
