---
# Create/setup a root CA + certs
# Pinned rather than taken from an apt repo: smallstep is not in the ubuntu
# archive, and a pinned .deb keeps a third party repository out of the shipped
# image's sources. Same pattern as wstunnel in playbooks/management/vpn.yml.
- name: Install step-cli for ca management
  ansible.builtin.apt:
    deb: https://github.com/smallstep/cli/releases/download/v{{ step_cli_version }}/step-cli_{{ step_cli_version }}-1_amd64.deb

- name: Create directory to hold or ca
  ansible.builtin.file:
    path: /root/{{ item }}
    state: directory
    mode: "0700"
  loop:
    - ca
    - ca/intermediate
    - ca/intermediate/certs
    - ca/intermediate/private

- name: Generate the CA key and cert
  ansible.builtin.command:
    # 43800h = 5 years, which is what cfssl's initca defaulted to
    cmd: >
      step certificate create "ICPC Root CA" ca.pem ca-key.pem
      --profile root-ca
      --kty RSA --size 2048
      --not-after 43800h
      --no-password --insecure
    chdir: /root/ca
    creates: /root/ca/ca.pem

- name: Make directory /root/ca/assemble
  ansible.builtin.file:
    state: directory
    path: /root/ca/assemble
    owner: root
    group: root
    mode: "0755"

- name: Copy the CA cert to the system CA store
  ansible.builtin.copy:
    src: /root/ca/ca.pem
    dest: /usr/local/share/ca-certificates/ca-icpc.crt
    mode: "0644"
    remote_src: true
  notify: Run update-ca-certificates

- name: Generate certs for hosts that need one
  ansible.builtin.command:
    # 8760h = 1 year, matching the old ca-config.json https profile
    cmd: >
      step certificate create "{{ item.cn }}" {{ item.name }}.pem {{ item.name }}-key.pem
      --profile leaf
      --ca ca.pem --ca-key ca-key.pem
      --kty RSA --size 2048
      --not-after 8760h
      --no-password --insecure
      {% for host in item.hostnames.split(',') %}--san {{ host }} {% endfor %}
    chdir: /root/ca
    creates: /root/ca/{{ item.name }}.pem
  loop: "{{ ca_target_certs }}"

- name: Copy certs to /etc/ssl
  ansible.builtin.copy:
    src: /root/ca/{{ item.name }}.pem
    dest: /etc/ssl/{{ item.name }}.crt
    mode: "0644"
    remote_src: true
  loop: "{{ ca_target_certs }}"
- name: Copy keys to /etc/ssl
  ansible.builtin.copy:
    src: /root/ca/{{ item.name }}-key.pem
    dest: /etc/ssl/{{ item.name }}.key
    mode: "0600"
    remote_src: true
  loop: "{{ ca_target_certs }}"

