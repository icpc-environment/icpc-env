# IntelliJ repository (unofficial ppa: https://github.com/JonasGroeger/jetbrains-ppa)
# Skipped when building against the sysops mirror, which carries its own
# mirror of this repository (see playbooks/apt-sources.yml).
- name: Apt key for IntelliJ IDEA
  ansible.builtin.get_url:
    url: https://s3.eu-central-1.amazonaws.com/jetbrains-ppa/0xA6E8698A.pub.asc
    dest: /etc/apt/keyrings/jetbrains.asc
  when: apt_package_source != 'pc2'
- name: Apt repo for IntelliJ IDEA
  ansible.builtin.deb822_repository:
    name: jetbrains
    types: deb
    uris: http://jetbrains-ppa.s3-website.eu-central-1.amazonaws.com
    suites: any
    components: main
    architectures: amd64
    signed_by: /etc/apt/keyrings/jetbrains.asc
  when: apt_package_source != 'pc2'

- name: Refresh the apt cache for the jetbrains repository
  ansible.builtin.apt:
    update_cache: true
  when: apt_package_source != 'pc2'


# IntelliJ IDEA(4389mb installed in /opt/intellij-idea)
- name: Install IntelliJ IDEs
  when: "'intellij-idea' in devtools"
  ansible.builtin.package:
    state: present
    name:
      - intellij-idea

# For intellij+kotlin, we need to fetch kotlin from maven (it doesn't want to easily use the local files we have)
- name: Install maven
  ansible.builtin.package:
    name: maven
    state: present
- name: Make sure m2 repository exists
  ansible.builtin.file:
    state: directory
    path: /opt/m2/repository
    mode: '0755'
    owner: root
    group: root
# 14mb
# version comes from /opt/intellij-idea/plugins/Kotlin/kotlinc/build.txt ex: 2.1.21-release-317
- name: Fetch some things from maven
  ansible.builtin.command: mvn dependency:get -Dartifact="org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.1.21" -Dmaven.repo.local="/opt/m2/repository"
  register: maven_get
  changed_when: maven_get.rc != 0

- name: Create .m2 directory in /etc/skel
  file:
    path: /etc/skel/.m2
    state: directory
- name: Set up m2 settings.xml to point to /opt/m2/repository
  copy:
    content: |
      <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
        xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 https://maven.apache.org/xsd/settings-1.0.0.xsd">
        <localRepository>/opt/m2/repository</localRepository>
        <offline>true</offline>
      </settings>
    dest: /etc/skel/.m2/settings.xml
    owner: root
    group: root
    mode: '0644'

# PyCharm(3603mb installed in /opt/pycharm)
- name: Install PyCharm
  when: "'intellij-pycharm' in devtools"
  ansible.builtin.package:
    state: present
    name:
      - pycharm

# Clion(4880mb installed in /opt/clion)
- name: Install clion block
  when: "'intellij-clion' in devtools"
  block:
    - name: Install clion
      ansible.builtin.apt:
        state: present
        pkg:
          - clion

    # Clion likes a weirdly formatted keyfile (UCS2 encoding with a BOM)
    - name: Create a script to configure clion license
      ansible.builtin.copy:
        dest: /usr/local/bin/clion-license-key-install
        mode: '0755'
        content: |
          #!/bin/bash
          # Exit if we're root (because we don't need to bother doing it for them)
          if [ "$EUID" -eq 0 ]; then
            exit 0
          fi
          configdir=$(jq -r '.dataDirectoryName // empty' /opt/clion/product-info.json)
          if [ -z "$configdir" ]; then
            exit 1
          fi
          mkdir -p "$HOME/.config/JetBrains/$configdir"
          (
            printf '\xFF\xFF';
            echo -en "<certificate-key>\n{{ clion_license_key }}" | iconv -f UTF-8 -t UCS2 -
          ) > "$HOME/.config/JetBrains/$configdir/clion.key"
      when: clion_license_key | length > 0

    - name: Add licensekey script to autostart
      ansible.builtin.copy:
        dest: /etc/xdg/autostart/clion-license-key-install.desktop
        content: |
          [Desktop Entry]
          Type=Application
          Exec=/usr/local/bin/clion-license-key-install
          NoDisplay=true
        mode: "0644"
        owner: "root"
        group: "root"
      when: clion_license_key | length > 0

    - name: Hide clion shortcut (if we don't have a license key for it)
      ansible.builtin.command: mv /usr/share/applications/clion.desktop /usr/share/applications/clion.desktop.disabled
      args:
        creates: /usr/share/applications/clion.desktop.disabled
      when: clion_license_key | length == 0

# JetBrains ships AI assistant/completion plugins with the IDEs. Remove them from
# every product we install rather than per-product, since which plugin lands in
# which IDE moves around between releases and a missing path is a no-op.
- name: Remove the AI plugins bundled with the JetBrains IDEs
  ansible.builtin.file:
    path: "/opt/{{ item.0 }}/plugins/{{ item.1 }}"
    state: absent
  loop: "{{ ['intellij-idea', 'pycharm', 'clion'] | product(['fullLine', 'full-line-completion', 'llm', 'ml-llm']) | list }}"

# The IDEs also look for a .noai marker to disable all AI features machine-wide.
- name: Create the .noai marker so the JetBrains IDEs disable AI features
  ansible.builtin.copy:
    dest: "{{ item }}"
    content: ""
    mode: "0644"
    owner: root
    group: root
  loop:
    - /.noai
    - /etc/skel/.noai

- name: Disable the data sharing consent prompt in the JetBrains IDEs
  ansible.builtin.lineinfile:
    path: "/opt/{{ item.dir }}/bin/{{ item.vmoptions }}"
    line: -Djb.consents.confirmation.enabled=false
  when: item.devtool in devtools
  loop:
    - { devtool: intellij-idea, dir: intellij-idea, vmoptions: idea64.vmoptions }
    - { devtool: intellij-pycharm, dir: pycharm, vmoptions: pycharm64.vmoptions }
    - { devtool: intellij-clion, dir: clion, vmoptions: clion64.vmoptions }

- name: Make sure directory exists for accepting eula prefs
  ansible.builtin.file:
    # This wild path is the java encoded version of `privacy_policy`
    path: /etc/skel/.java/.userPrefs/jetbrains/_!(!!cg"p!(}!}@"j!(k!|w"w!'8!b!"p!':!e@==
    state: directory
- name: Accept some eula for intellij products
  ansible.builtin.copy:
    dest: /etc/skel/.java/.userPrefs/jetbrains/_!(!!cg"p!(}!}@"j!(k!|w"w!'8!b!"p!':!e@==/prefs.xml
    owner: root
    group: root
    mode: '0644'
    content: |
      <?xml version="1.0" encoding="UTF-8" standalone="no"?>
      <!DOCTYPE map SYSTEM "http://java.sun.com/dtd/preferences.dtd">
      <map MAP_XML_VERSION="1.0">
        <entry key="eua_accepted_version" value="2.0"/>
      </map>


