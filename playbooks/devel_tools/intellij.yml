# IntelliJ repository (unofficial ppa: https://github.com/JonasGroeger/jetbrains-ppa)
- name: apt key for IntelliJ IDEA
  ansible.builtin.get_url:
    url: https://s3.eu-central-1.amazonaws.com/jetbrains-ppa/0xA6E8698A.pub.asc
    dest: /etc/apt/keyrings/jetbrains.asc

- name: apt repo for IntelliJ IDEA
  apt_repository:
    repo: deb [arch=amd64 signed-by=/etc/apt/keyrings/jetbrains.asc] http://jetbrains-ppa.s3-website.eu-central-1.amazonaws.com any main
    update_cache: true

# IntelliJ IDEA community(~968mb installed in /opt/intellij-idea-community)
- name: install IntelliJ IDEs
  when: "'intellij-idea' in devtools"
  apt:
    state: present
    pkg:
    - intellij-idea-community

# For intellij+kotlin, we need to fetch kotlin from maven (it doesn't want to easily use the local files we have)
- name: install maven
  apt:
    pkg: maven
    state: present
- name: make sure m2 repository exists
  file:
    state: directory
    path: /opt/m2/repository
    mode: 0755
    owner: root
    group: root
# TODO: figure out where 1.9.22 comes from (intellij has a default for this)
# TODO: maybe from /opt/intellij-idea-community/plugins/Kotlin/kotlinc/build.txt
- name: fetch some things from maven # TODO: make idempotent
  shell: mvn dependency:get -Dartifact="org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.24" -Dmaven.repo.local="/opt/m2/repository"
- name: fetch some things from maven # TODO: make idempotent
  shell: mvn dependency:get -Dartifact="org.jetbrains.kotlin:kotlin-stdlib:2.0.10" -Dmaven.repo.local="/opt/m2/repository"

# Set up the maven repository for intellij
# This goes in ~/.config/JetBrains/IdeaIC2024.2/options/path.macros.xml
# <application>
#   <component name="PathMacrosImpl">
