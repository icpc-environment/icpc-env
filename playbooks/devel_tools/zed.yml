---
# https://zed.dev/ - Zed is a next-generation code editor designed for high-performance collaboration with humans and AI.
- name: Download zed
  ansible.builtin.unarchive:
    src: https://zed.dev/api/releases/stable/latest/zed-linux-x86_64.tar.gz
    dest: /opt
    remote_src: yes

- name: symlink zed to somewhere on the path
  ansible.builtin.file:
    src: /opt/zed.app/bin/zed
    dest: /usr/local/bin/zed
    state: link

- name: Create a desktop entry for zed
  ansible.builtin.copy:
    dest: /usr/share/applications/dev.zed.Zed.desktop
    src: /opt/zed.app/share/applications/zed.desktop
    remote_src: true

- name: Copy icon for zed
  ansible.builtin.copy:
    dest: /usr/share/icons/hicolor/512x512/apps/zed.png
    src: /opt/zed.app/share/icons/hicolor/512x512/apps/zed.png
    remote_src: true
