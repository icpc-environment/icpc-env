# Skipped when building against the sysops mirror, which carries its own
# mirror of this repository (see playbooks/apt-sources.yml).
- name: Fetch the vscode signing key
  ansible.builtin.get_url:
    url: https://packages.microsoft.com/keys/microsoft.asc
    dest: /etc/apt/keyrings/microsoft.asc
  when: apt_package_source != 'pc2'

# The code package's postinst manages this same file once it is installed,
# which is what the code/add-microsoft-repo debconf answer below is about.
- name: Add the vscode repository
  ansible.builtin.deb822_repository:
    name: vscode
    types: deb
    uris: https://packages.microsoft.com/repos/vscode
    suites: stable
    components: main
    architectures: amd64
    signed_by: /etc/apt/keyrings/microsoft.asc
  when: apt_package_source != 'pc2'

- name: Refresh the apt cache for the vscode repository
  ansible.builtin.apt:
    update_cache: true
  when: apt_package_source != 'pc2'

- name: Remove any entries from the hosts file for vscode extensions, so we can install/update them properly
  ansible.builtin.lineinfile:
    path: /etc/hosts
    state: absent
    regexp: '^.*marketplace.visualstudio.com.*$'

# debconf-get-selections | grep ^code
# code    code/add-microsoft-repo boolean true
- name: Configure the vscode package to install sources.list
  ansible.builtin.debconf:
    name: code
    question: code/add-microsoft-repo
    value: true
    vtype: boolean

- name: Install vscode
  ansible.builtin.apt:
    state: present
    pkg:
      - code
      - bindfs
      - libnss3-tools # for modifying the nssdb pki store (where vscode holds trusted root certificate authorities)
      - moreutils # for sponge to let us modify files "in-place"
      - jq # rewrites the extension metadata further down, piped into sponge

- name: Make sure vscode extension directory exists
  ansible.builtin.file:
    path: /opt/vscode/extensions
    state: directory
    mode: "0755"
    owner: "root"
    group: "root"

- name: Install vscode extensions
  ansible.builtin.shell: >
    stat /opt/vscode/extensions/{{ item }}* ||
    code --extensions-dir /opt/vscode/extensions --user-data-dir /opt/vscode --no-sandbox --install-extension {{ item }}
  loop: "{{ vscode_extensions }}"
  register: result
  changed_when: "'successfully installed' in result.stdout"

- name: Cleanup vscode extension related directories
  ansible.builtin.file:
    path: /opt/vscode/{{ item }}
    state: absent
  loop:
    - logs                  # 180k
    - CachedProfilesData    # 748k
    - CachedExtensionVSIXs  # 248M
    - User                  # 4k

- name: Create a script to create an overlayfs for vscode extensions
  ansible.builtin.copy:
    dest: /usr/local/bin/vscode-extension-install
    mode: '0755'
    content: |
      #!/bin/bash
      # TODO: maybe we can make this conditional on the group instead of the user?
      # Exit if we're not the contestant (because we don't need to bother doing it for anyone else)
      if [ "$SUDO_USER" != "contestant" ]; then
        exit 0
      fi

      # Get the home directory for the user based on UID
      USERHOME=$(getent passwd $SUDO_UID | cut -d: -f6)

      # Make sure to import our root CA into the nssdb so vscode trusts our extension server
      mkdir -p $USERHOME/.pki/nssdb
      certutil -d sql:$USERHOME/.pki/nssdb -A -t "C,," -n "ICPC Root CA" -i /usr/local/share/ca-certificates/ca-icpc.crt
      certutil -d sql:$USERHOME/.pki/nssdb -A -t "C,," -n "ICPC Network Filter" -i /usr/local/share/ca-certificates/squid-ca.crt
      chown -R $SUDO_UID:$SUDO_GID $USERHOME/.pki

      mkdir -p $USERHOME/.vscode/extensions $USERHOME/.vscode/extensions-work $USERHOME/.vscode/extensions-overlay $USERHOME/.vscode/extensions-root

      # Make sure it isn't mounted
      umount -f $USERHOME/.vscode/extensions || true
      umount -f $USERHOME/.vscode/extensions-root || true

      # Make sure permissions are correct
      chown -R $SUDO_UID:$SUDO_GID $USERHOME/.vscode

      set -e # Exit on error from this point forward

      # Mount the overlayfs
      mount -t overlay -o metacopy=on,lowerdir=/opt/vscode/extensions,upperdir=$USERHOME/.vscode/extensions-overlay,workdir=$USERHOME/.vscode/extensions-work overlay $USERHOME/.vscode/extensions-root

      # Use bindfs to make it writable by the SUDO user (which then overlayfs takes care of properly)
      bindfs -u $SUDO_UID -g $SUDO_GID $USERHOME/.vscode/extensions-root $USERHOME/.vscode/extensions

# Add a sudoers file to allow the users to run vscode-extension-install as root
- name: Add sudoers file for vscode-extension-install
  ansible.builtin.copy:
    dest: /etc/sudoers.d/vscode-extension-install
    content: |
      ALL ALL=(ALL) NOPASSWD: /usr/local/bin/vscode-extension-install
    mode: '0440'

- name: Add vscode extension install script to autostart
  ansible.builtin.copy:
    dest: /etc/xdg/autostart/vscode-extension-install.desktop
    content: |
      [Desktop Entry]
      Type=Application
      Exec=/usr/bin/sudo /usr/local/bin/vscode-extension-install
      NoDisplay=true
    mode: "0755"
    owner: "root"
    group: "root"


# create a mirror for optional vscode extensions that will be served by an offline vscode extension marketplace server
- name: Make sure vscodeoffline directory exists
  ansible.builtin.file:
    path: /opt/vscodeoffline
    state: directory
    mode: "0755"

- name: Make sure installers directory exists or vscodegallery barfs
  ansible.builtin.file:
    path: /opt/vscodeoffline/installers
    state: directory
    mode: "0755"

# TODO: this is flaky; it crashes from time to time :sigh:
- name: Create a specified.json file for vscode optional extensions
  ansible.builtin.copy:
    dest: /opt/vscodeoffline/specified.json
    content: |
      {
        "extensions": {{ vscode_optional_extensions | ansible.builtin.to_json }}
      }
    mode: '0644'

- name: Sync the extensions we need
  ansible.builtin.command: >
    podman run --rm
    -v /opt/vscodeoffline:/artifacts
    -e SYNCARGS="--skip-binaries --check-specified-extensions --update-extensions"
    docker.io/lolinternet/vscsync:latest

- name: Set recommended=true for each extension so it's easy to see what we have available (search for @popular in vscode to see all extensions)
  ansible.builtin.command: >
    find /opt/vscodeoffline/extensions -name latest.json -exec sh -c "jq '.recommended=true' {} | sponge {}" \;

