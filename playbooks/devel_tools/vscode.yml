- name: Make sure the quadlet directory exists
  ansible.builtin.file:
    path: /etc/containers/systemd
    state: directory
    mode: "0755"
    owner: root
    group: root

- name: Install the vscgallery quadlet unit
  ansible.builtin.copy:
    dest: /etc/containers/systemd/vscgallery.container
    mode: "0644"
    owner: root
    group: root
    content: |
      [Unit]
      Description=Offline vscode extension marketplace

      [Container]
      ContainerName=vscgallery
      Image=docker.io/lolinternet/vscgallery:latest
      Network=host
      Environment=BIND=127.0.0.5:443
      Volume=/opt/vscodeoffline:/artifacts
      Volume=/root/ca/vscgallery.pem:/opt/vscoffline/vscgallery/ssl/vscoffline.crt
      Volume=/root/ca/vscgallery-key.pem:/opt/vscoffline/vscgallery/ssl/vscoffline.key

      [Service]
      Restart=always

      [Install]
      WantedBy=multi-user.target

- name: Add vscgallery.service.d directory
  ansible.builtin.file:
    name: /etc/systemd/system/vscgallery.service.d
    state: directory
    mode: '0755'
    owner: root
    group: root

- name: Add vscgallery.service.d/10-ConditionHost file
  when: false # TODO: For World finals image only
  ansible.builtin.copy:
    dest: /etc/systemd/system/vscgallery.service.d/10-ConditionHost.conf
    mode: '0644'
    owner: root
    group: root
    content: |
      [Unit]
      ConditionHost=
      ConditionHost=|icpc
      ConditionHost=|team*
      ConditionHost=|judge*
      ConditionHost=|*admin*

# The quadlet generator turns the file above into vscgallery.service on
# daemon-reload, and honours [Install] itself, so there is nothing to enable -
# a generated unit cannot be enabled with systemctl anyway.
- name: Ensure vscgallery container is started
  ansible.builtin.systemd_service:
    name: vscgallery
    daemon_reload: true
    state: started

- name: Update hosts file so the vscode update sites are present
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^.*marketplace.visualstudio.com.*$'
    line: "127.0.0.5	update.code.visualstudio.com az764295.vo.msecnd.net marketplace.visualstudio.com"
    owner: root
    group: root
    mode: '0644'

- name: Make sure settings directory exists
  ansible.builtin.file:
    path: /etc/skel/.config/Code/User
    state: directory
- name: Set some global vscode settings
  ansible.builtin.copy:
    dest: /etc/skel/.config/Code/User/settings.json
    mode: '0644'
    owner: root
    group: root
    content: |
      {
        "chat.disableAIFeatures": true,
        "github.completions.enabled": false,
        "editor.inlineSuggest.enabled": false,
        "security.workspace.trust.enabled": false
      }

- name: Put a shortcut to vscode on the desktop
  ansible.builtin.copy:
    dest: /etc/skel/Desktop/code.desktop
    src: /usr/share/applications/com.microsoft.VSCode.desktop
    mode: "0755"
    owner: "root"
    group: "root"
    remote_src: true
