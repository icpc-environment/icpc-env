- name: apt key for vscode
  apt_key:
    url: https://packages.microsoft.com/keys/microsoft.asc
    state: present
    keyring: /etc/apt/trusted.gpg.d/microsoft.gpg

- name: apt repo for vscode
  apt_repository: repo="deb [arch=amd64] https://packages.microsoft.com/repos/vscode stable main" update_cache=yes filename="vscode"

- name: install vscode
  apt:
    state: present
    pkg:
      - code
      - bindfs # so we can make their extensions directory writable

- name: make sure vscode extension directory exists
  file: path=/opt/vscode/extensions state=directory
- name: vscode extensions # TODO: make idempotent
  shell: code --extensions-dir /opt/vscode/extensions --user-data-dir /opt/vscode --no-sandbox --install-extension {{ item }}
  loop: "{{ vscode_extensions }}"

# approx 669MB (when functional)

- name: create a script to create an overlayfs for vscode extensions
  copy:
    dest: /usr/local/bin/vscode-extension-install
    mode: 0755
    content: |
      #!/bin/bash
      # Exit if we're not the contestant (because we don't need to bother doing it for anyone else)
      if [ "$SUDO_USER" -ne "contestant" ]; then
        exit 0
      fi

      # Because this might be set wrong by sudo/whatever
      HOME=/home/contestant/

      mkdir -p $HOME/.vscode/extensions $HOME/.vscode/extensions-work $HOME/.vscode/extensions-overlay $HOME/.vscode/extensions-root

      # Make sure it isn't mounted
      umount -f $HOME/.vscode/extensions || true
      umount -f $HOME/.vscode/extensions-root || true

      # Make sure permissions are correct
      chown -R contestant:contestant $HOME/.vscode

      set -e # Exit on error from this point forward

      # Mount the overlayfs
      mount -t overlay -o metacopy=on,lowerdir=/opt/vscode/extensions,upperdir=$HOME/.vscode/extensions-overlay,workdir=$HOME/.vscode/extensions-work overlay $HOME/.vscode/extensions-root

      # Use bindfs to make it writable by the contestant user (which then overlayfs takes care of properly)
      bindfs -u contestant -g contestant $HOME/.vscode/extensions-root $HOME/.vscode/extensions

# Add a sudoers file to allow the contestant user to run vscode-extension-install as root
- name: add sudoers file for vscode-extension-install
  copy:
    dest: /etc/sudoers.d/vscode-extension-install
    content: |
      contestant ALL=(ALL) NOPASSWD: /usr/local/bin/vscode-extension-install
    mode: 0440

- name: add vscode extension install script to autostart
  copy:
    dest: /etc/xdg/autostart/vscode-extension-install.desktop
    mode: 0755
    content: |
      [Desktop Entry]
      Type=Application
      Exec=/usr/bin/sudo /usr/local/bin/vscode-extension-install
      NoDisplay=true


