  - name: fixup the eclipse.ini file to use our custom configuration
    lineinfile: dest=/opt/eclipse/eclipse.ini insertafter="-vmargs" line="-Declipse.pluginCustomization=/opt/eclipse/eclipse_plugincustomization.ini"




# The old way would have been https://github.com/alfsch/workspacemechanic, but that's dead, and oomph seems to be the new thing
# except oomph doesn't work for everything. It does do the jvm part properly, but not pydev interpreters :(
  # OOMPH things:
  # installation specific oomph setup file: /opt/eclipse/configuration/org.eclipse.oomph.setup/installation.setup
  # user oomph setup file: /home/.eclipse/org.eclipse.oomph.setup/setups/user.setup
  # Something about oomph requires online connectivity; it downloads/caches a bunch of stuff in .eclipse, and without it the setup scripts don't work properly
  # Maybe there's some way to "install" those globally, and maybe use an installation.setup file so we don't need to do anything in the home directory

# OOMPH is there out of the box, so we don't need this
  # - name: make sure the feature group for oomph setup is installed
  #   when: '"org.eclipse.oomph.setup.feature.group" not in eclipse_installed_pkgs.stdout'
  #   shell: |
  #     /opt/eclipse/eclipse -nosplash \
  #         -application org.eclipse.equinox.p2.director \
  #         -destination /opt/eclipse \
  #         -installIU org.eclipse.oomph.setup.feature.group | grep -v DEBUG


