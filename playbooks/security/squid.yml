---
- name: Install squid
  ansible.builtin.apt:
    pkg:
      - squid-common
      - squid-openssl
    state: present

- name: Configure squid
  ansible.builtin.template:
    src: files/squid/squid.conf.j2
    dest: /etc/squid/squid.conf
  notify: Restart squid

- name: Make sure an autologin.conf file exists or squid won't start
  copy:
    content: "#placeholder\n"
    dest: /etc/squid/autologin.conf
    mode: 0640
    owner: root
    group: root

# TODO: squid complains about "unsupported error page %code near %}body" and "%}sub" and `%">`
# TODO: which is because of the embedded pretty css we have.
- name: Copy a pretty error page for squid to use
  ansible.builtin.template:
    src: files/squid/block.html.j2
    dest: /usr/share/squid/errors/templates/ICPC_ERR_ACCESS_DENIED

# TODO: make this CA an intermediate signed by the ICPC root CA
- name: Generate a fake CA for squid to use
  ansible.builtin.shell: openssl req -new -newkey rsa:2048 -days 360 -nodes -x509 -keyout /etc/squid/squidCA.pem -out /etc/squid/squidCA.crt -subj "/O=ICPC Network Filter/CN=ICPC Network Filter"
  args:
    creates: /etc/squid/squidCA.crt

- name: Ensure that the squidCA is trusted by the system
  ansible.builtin.file:
    src: /etc/squid/squidCA.crt
    dest: /usr/local/share/ca-certificates/squid-ca.crt
    state: link
  notify: Run update-ca-certificates

- name: Initialize squid ssl cache
  ansible.builtin.shell: /usr/lib/squid/security_file_certgen -c -s /var/spool/squid/ssl_db -M 4MB
  args:
    creates: /var/spool/squid/ssl_db/index.txt

- name: Copy proxy environment config (to be applied to contestant user)
  ansible.builtin.copy:
    dest: /etc/environment-proxied
    content: |
      http_proxy="http://localhost:3128/"
      https_proxy="http://localhost:3128/"
      ftp_proxy="http://localhost:3128/"
      no_proxy="localhost,127.0.0.1"
      HTTP_PROXY="http://localhost:3128/"
      HTTPS_PROXY="http://localhost:3128/"
      FTP_PROXY="http://localhost:3128/"
      NO_PROXY="localhost,127.0.0.1"
- name: Copy the pam-auth-update config file to load the proxy environment for the contestant user
  ansible.builtin.copy:
    dest: /usr/share/pam-configs/proxyenv
    content: |
      Name: Load /etc/environment-proxied for the contestant user
      Default: no
      Priority: 0
      Session-Type: Additional
      Session:
              [default=1 success=ignore] pam_succeed_if.so quiet user = contestant
              required     pam_env.so user_readenv=0 envfile=/etc/environment-proxied

- name: Check if proxyenv PAM config is already enabled
  ansible.builtin.shell: grep -q "pam_succeed_if.so quiet user = contestant" /etc/pam.d/common-session
  register: proxyenv_enabled
  failed_when: false
  changed_when: false

- name: Enable proxyenv PAM configuration
  ansible.builtin.command: pam-auth-update --enable proxyenv
  when: proxyenv_enabled.rc != 0
