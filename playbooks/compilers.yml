---
- name: Install build-essential, because it has lots of common useful packages
  ansible.builtin.apt:
    pkg: build-essential
    state: present

- name: Include various languages
  ansible.builtin.include_tasks:
    file: "languages/{{ language }}.yml"
    apply:
      tags: always
  loop: "{{ languages }}"
  loop_control:
    loop_var: language

- name: Install podman (for devdocs)
  ansible.builtin.apt:
    pkg: podman
    state: present

#  - name: Put an alias in for podman so that the shortname for ruby works right
#    ansible.builtin.copy:
#      dest: /etc/containers/registries.conf.d/ruby-shortname.conf
#      content: |
#        [aliases]
#          "ruby" = "docker.io/library/ruby"

- name: Gather info on a specific image
  become: true
  containers.podman.podman_image_info:
    name: devdocs
  register: devdocs_info

- name: Build devdocs if it does not exist
  when: devdocs_info.images | length == 0
  block:
    - name: Fetch the devdocs repo
      ansible.builtin.git:
        # The icpcsysops fork carries the scraper fixes needed for current kotlin
        repo: https://github.com/icpcsysops/devdocs.git
        dest: /tmp/devdocs-build
        version: '6d2b0cd7ef8026180ccb9c4ed3a37d5cb08cf154' # main on 2026-08-20
        force: true

    - name: Update default_docs in lib/app.rb
      ansible.builtin.replace:
        path: /tmp/devdocs-build/lib/app.rb
        regexp: 'set :default_docs, %w.*'
        replace: 'set :default_docs, %w({{ devdocs_docs | join(" ") }})'

    - name: Update hideIntro in assets/javascripts/app/settings.js
      ansible.builtin.replace:
        path: /tmp/devdocs-build/assets/javascripts/app/settings.js
        regexp: 'hideIntro:.*'
        replace: 'hideIntro: true,'

    - name: Update dockerfile to only fetch things we care about
      ansible.builtin.replace:
        path: /tmp/devdocs-build/Dockerfile-alpine
        regexp: 'thor docs:download --all'
        replace: 'thor docs:download {{ devdocs_docs | map("regex_replace", "~", "@") | join(" ") }}'

    - name: Update dockerfile to fix the image name
      ansible.builtin.replace:
        path: /tmp/devdocs-build/Dockerfile-alpine
        regexp: 'FROM ruby:'
        replace: "FROM docker.io/ruby:" # TODO: or the podman alias for shortnames above?

    - name: Build and deploy docker container
      when: ansible_connection != "chroot"
      block:
        - name: Build the docker container
          become: true
          containers.podman.podman_image:
            name: devdocs
            path: /tmp/devdocs-build
            build:
              file: Dockerfile-alpine
        - name: Make sure the quadlet directory exists
          ansible.builtin.file:
            path: /etc/containers/systemd
            state: directory
            mode: "0755"
            owner: root
            group: root
        - name: Install the devdocs quadlet unit
          ansible.builtin.copy:
            dest: /etc/containers/systemd/devdocs.container
            mode: "0644"
            owner: root
            group: root
            content: |
              [Unit]
              Description=Local devdocs documentation server

              [Container]
              ContainerName=devdocs
              Image=localhost/devdocs:latest
              Network=host
              # bind only to our special localhost ip
              Exec=rackup -o 127.0.0.10

              [Service]
              Restart=always

              [Install]
              WantedBy=multi-user.target
        # The quadlet generator turns the file above into devdocs.service on
        # daemon-reload, and honours [Install] itself, so there is nothing to
        # enable - a generated unit cannot be enabled with systemctl anyway.
        - name: Ensure devdocs container is started
          ansible.builtin.systemd_service:
            name: devdocs
            daemon_reload: true
            state: started


- name: Install language scripts
  ansible.builtin.copy:
    dest: /usr/local/bin/{{ item.key }}
    content: |
      #!/bin/bash
      {{ item.value }}
    mode: "0755"
    owner: "root"
    group: "root"
  loop: "{{ language_scripts | dict2items }}"
