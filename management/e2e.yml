---
# End-to-end test against a contestforge dev instance in ../../contestforge:
#   (in contestforge) just reset-db && just seed-db && just e2e-kit && just deploy
#   just mgmt deploy -e @e2e.yml
# The server serves the instance's published files at /configs/, takes its
# fleets, and uses the kit's host CA and server key and certificate. The host
# CA stays on the server afterwards (it's never replaced), so do this only on a
# server whose host CA the kit made.
contestforge_dir: "{{ playbook_dir }}/../../contestforge"
published_configs_dir: "{{ contestforge_dir }}/instance/deployments"
fleets_url: "https://{{ external_hostname }}/configs/fleets.json"
config_signers: ["{{ lookup('file', contestforge_dir + '/secrets/e2e/config-signers') }}"]
server_secrets_dir: "{{ contestforge_dir }}/secrets/e2e/mgmt/{{ inventory_hostname }}"
