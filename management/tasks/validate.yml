---
- name: Check fleet names
  ansible.builtin.assert:
    that:
      - item is match('^[a-z][a-z0-9_-]{0,11}$')
    fail_msg: >-
      Fleet "{{ item }}" must be 1-12 characters of a-z, 0-9, _ and -, starting
      with a letter. It's a login name, and wg-fleet names its interface
      wg_<fleet>, which Linux limits to 15 characters.
    quiet: true
  loop: "{{ fleets.keys() | list }}"

- name: Check fleet ports and subnets
  ansible.builtin.assert:
    that:
      - item.value.port | int >= 51820
      - item.value.port | int <= 51920
      - fleets.values() | map(attribute='port') | select('equalto', item.value.port) | list | length == 1
      - item.value.subnet | ansible.utils.ipv6('net') is string
      - fleets.values() | map(attribute='subnet') | select('equalto', item.value.subnet) | list | length == 1
      - item.value.ip | ansible.utils.ipaddr(item.value.subnet) is string
    fail_msg: >-
      Fleet "{{ item.key }}" needs its own port in 51820-51920 (nginx only
      proxies wstunnel to those), its own IPv6 subnet, and an ip inside it.
    quiet: true
  loop: "{{ fleets | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: Look up existing users
  ansible.builtin.getent:
    database: passwd

- name: Check fleet names aren't taken by other users
  ansible.builtin.assert:
    that:
      - item not in getent_passwd or getent_passwd[item][4] == '/home/' + item
    fail_msg: >-
      Fleet "{{ item }}" would reuse the existing user {{ item }}
      (home {{ getent_passwd[item][4] | default('') }}); pick another name.
    quiet: true
  loop: "{{ fleets.keys() | list }}"

- name: Check each fleet's subnet is written as four groups and ::/64
  ansible.builtin.assert:
    that:
      - item.value.subnet is match('^([0-9a-f]{1,4}:){4}:/64$')
    fail_msg: >-
      Fleet "{{ item.key }}" subnet {{ item.value.subnet }} must look like
      fd00:a0a8:34d:4201::/64, as the generator in vars.yml writes them. The
      ssh configs match a fleet's machines by that prefix.
    quiet: true
  loop: "{{ fleets | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: Check each fleet has its ssh keys
  ansible.builtin.assert:
    that:
      - (fleet_secrets_dir + '/' + item + '/server_ca.pub') is file
      - (fleet_secrets_dir + '/' + item + '/icpcadmin@contestmanager-cert.pub') is file
    fail_msg: >-
      secrets/{{ item }} is missing; run `just keys {{ item }}`, and build that
      contest's images with the same keys.
    quiet: true
  loop: "{{ fleets.keys() | list }}"
