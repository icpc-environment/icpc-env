---
- name: Make sure the static fleets' users have a .ssh directory
  file:
    path: "~{{ item }}/.ssh"
    state: directory
    mode: '0700'
    owner: "{{ item }}"
    group: "{{ item }}"
  loop: "{{ fleets.keys() | list }}"

- name: add ssh public key for fleet users
  copy:
    content: "{{ fleet_authorized_keys[item] | default('') }}"
    dest: "~{{ item }}/.ssh/authorized_keys"
    owner: "{{ item }}"
    group: "{{ item }}"
    mode: '0600'
  loop: "{{ fleets.keys() | list }}"

# Team machines let it in through the server:<hostname> principal contestforge
# adds to every site in a fleet here, once it has a certificate
- name: Create the server's own ssh key, which root uses for ansible and screenshots
  command: ssh-keygen -q -t ed25519 -N "" -C "root@{{ external_hostname }}" -f /root/.ssh/id_ed25519
  args:
    creates: /root/.ssh/id_ed25519
- name: Copy the server's public key to {{ server_secrets_dir }}, for signing
  fetch:
    src: /root/.ssh/id_ed25519.pub
    dest: "{{ server_secrets_dir }}/id_ed25519.pub"
    flat: true
- name: Install the server key's certificate
  copy:
    src: "{{ server_secrets_dir }}/id_ed25519-cert.pub"
    dest: /root/.ssh/id_ed25519-cert.pub
    mode: '0644'
  when: (server_secrets_dir + '/id_ed25519-cert.pub') is file
- name: Say how to get the server key a certificate
  debug:
    msg: >-
      root can't log in to team machines until its key has a certificate. In
      contestforge run `flask ssh-cert sign --server {{ external_hostname }}
      --pubkey {{ server_secrets_dir }}/id_ed25519.pub`, save the certificate as
      {{ server_secrets_dir }}/id_ed25519-cert.pub and deploy again.
  when: (server_secrets_dir + '/id_ed25519-cert.pub') is not file

- name: Find ssh configs that point at the per-contest icpcadmin keys
  command: grep -lsx '    HostKeyAlias contestant\..*' /root/.ssh/config {{ fleets.keys() | map('regex_replace', '^', '/home/') | map('regex_replace', '$', '/.ssh/config') | join(' ') }}
  register: old_ssh_configs
  changed_when: false
  failed_when: false
- name: Remove them, so ssh uses the server's key and wg-fleet's host CA
  file:
    path: "{{ item }}"
    state: absent
  loop: "{{ old_ssh_configs.stdout_lines }}"
- name: Find the per-contest icpcadmin keys
  find:
    paths: "{{ ['/root/.ssh'] + fleets.keys() | map('regex_replace', '^', '/home/') | map('regex_replace', '$', '/.ssh') | list }}"
    patterns: 'icpcadmin@*'
  register: old_icpcadmin_keys
- name: Remove the per-contest icpcadmin keys
  file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ old_icpcadmin_keys.files }}"
  loop_control:
    label: "{{ item.path }}"
- name: Stop trusting the per-contest CAs for machines' host keys
  lineinfile:
    path: /etc/ssh/ssh_known_hosts
    regexp: '^@cert-authority contestant\.'
    state: absent
    create: true
    mode: '0644'

# fleet-sync writes both from /run/wg_fleets.json. A Match block in an
# included file ends with that file
- name: Let admins' certificates log in as their fleets' users
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/20-fleet-users.conf
    content: |
      Match Group fleets
          TrustedUserCAKeys /etc/ssh/fleet_user_ca.pub
          AuthorizedPrincipalsFile /etc/ssh/fleet_principals/%u
    mode: '0644'
  notify: Restart ssh

# sshd keeps the first value it reads, so this has to sort before cloud-init's 50-cloud-init.conf
- name: ensure password authentication is disabled in sshd
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-icpc-settings.conf
    content: |
      PasswordAuthentication no
      ChallengeResponseAuthentication no
      PubkeyAuthentication yes
  notify: Restart ssh
- name: Remove the old name of the sshd settings
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d/99-icpc-settings.conf
    state: absent
  notify: Restart ssh

- name: Create /etc/ansible
  file:
    path: /etc/ansible
    state: directory
    mode: '0755'
- name: Point ad-hoc ansible at wg-fleet's inventory of team machines
  copy:
    dest: /etc/ansible/ansible.cfg
    mode: '0644'
    content: |
      [defaults]
      inventory = /run/ansible_inventory.yml
      interpreter_python = auto_silent
      forks = 50

      [ssh_connection]
      pipelining = True
