---
- name: create a regular interactive user for each "fleet"
  user:
    name: "{{ item }}"
    shell: /bin/bash
    createhome: true
  loop: "{{ fleets.keys() | list }}"

- name: Make sure .ssh directory exists
  file:
    path: "~{{ item }}/.ssh"
    state: directory
    mode: '0700'
    owner: "{{ item }}"
    group: "{{ item }}"
  loop: "{{ admin_users }}"

- name: add ssh public key for fleet users
  copy:
    content: "{{ fleet_authorized_keys[item] | default('') }}"
    dest: "~{{ item }}/.ssh/authorized_keys"
    owner: "{{ item }}"
    group: "{{ item }}"
    mode: '0600'
  loop: "{{ fleets.keys() | list }}"

- name: Give each fleet's user that fleet's icpcadmin key, and root every fleet's
  copy:
    src: "{{ fleet_secrets_dir }}/{{ item[0][1] }}/icpcadmin@contestmanager{{ item[1] }}"
    dest: "~{{ item[0][0] }}/.ssh/icpcadmin@{{ item[0][1] }}{{ item[1] }}"
    mode: '0400'
    owner: "{{ item[0][0] }}"
    group: "{{ item[0][0] }}"
  loop: "{{ fleet_key_holders | product(['', '-cert.pub', '.pub']) | list }}"
  loop_control:
    label: "{{ item[0][0] }}: icpcadmin@{{ item[0][1] }}{{ item[1] }}"

- name: Point ssh at the right fleet's key for each team machine
  copy:
    content: |
      {% for fleet in fleet_key_holders | selectattr(0, 'equalto', item) | map(attribute=1) %}
      Host *.{{ fleet }} *.{{ fleet }}.icpcnet.internal {{ fleets[fleet].subnet | regex_replace('::/64$', ':*') }}
          IdentityFile ~/.ssh/icpcadmin@{{ fleet }}
          IdentitiesOnly yes
      {% endfor %}
      Host *
          User icpcadmin
    dest: "~{{ item }}/.ssh/config"
    owner: "{{ item }}"
    group: "{{ item }}"
    mode: '0644'
  loop: "{{ admin_users }}"

- name: use different set of host keys
  copy:
    src: "{{ fleet_secrets_dir }}/{{ mgmt_host_key_fleet }}/contestmanager.icpcnet.internal_{{ item.name }}"
    dest: /etc/ssh/ssh_{{ item.name }}
    mode: "{{ item.mode }}"
  loop:
    # sshd refuses a host key that anything but root can read
    - {name: host_ed25519_key, mode: "0600"}
    - {name: host_ed25519_key.pub, mode: "0644"}
    - {name: host_ed25519_key-cert.pub, mode: "0644"}
  notify: Restart ssh

- name: sshd host certificate
  copy:
    content: |
      HostKey /etc/ssh/ssh_host_ed25519_key
      HostCertificate /etc/ssh/ssh_host_ed25519_key-cert.pub
    dest: /etc/ssh/sshd_config.d/ssh_host_cert.conf
    mode: 0644
  notify: Restart ssh

# A fleet's CA only vouches for that fleet's machines
- name: Trust each fleet's ssh CA for its own machines' host keys
  copy:
    content: |
      {% for fleet in fleets %}
      @cert-authority *.{{ fleet }},*.{{ fleet }}.icpcnet.internal,{{ fleets[fleet].subnet | regex_replace('::/64$', ':*') }} {{ lookup('file', fleet_secrets_dir + '/' + fleet + '/server_ca.pub') }}
      {% endfor %}
    dest: /etc/ssh/ssh_known_hosts
    mode: '0644'

# sshd keeps the first value it reads, so this has to sort before cloud-init's 50-cloud-init.conf
- name: ensure password authentication is disabled in sshd
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-icpc-settings.conf
    content: |
      PasswordAuthentication no
      ChallengeResponseAuthentication no
      PubkeyAuthentication yes
  notify: Restart ssh
- name: Remove the old name of the sshd settings
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d/99-icpc-settings.conf
    state: absent
  notify: Restart ssh

- name: Create /etc/ansible
  file:
    path: /etc/ansible
    state: directory
    mode: '0755'
- name: Point ad-hoc ansible at wg-fleet's inventory of team machines
  copy:
    dest: /etc/ansible/ansible.cfg
    mode: '0644'
    content: |
      [defaults]
      inventory = /run/ansible_inventory.yml
      interpreter_python = auto_silent
      forks = 50

      [ssh_connection]
      pipelining = True
