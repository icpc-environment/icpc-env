---
- name: proxy settings for wg-fleet's public endpoints
  copy:
    dest: /etc/nginx/snippets/wg-fleet-proxy.conf
    content: |
      proxy_set_header        Host $host;
      proxy_set_header        X-Real-IP $remote_addr;
      proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header        X-Forwarded-Proto $scheme;
      proxy_pass http://127.0.0.1:8000;
      proxy_read_timeout  90;
    mode: '0644'
  notify: Restart nginx
- name: copy default nginx config
  template: src=templates/nginx.conf.j2 dest=/etc/nginx/nginx.conf
  notify: Restart nginx
- name: disable default nginx site
  file: state=absent path=/etc/nginx/sites-enabled/default
  notify: Restart nginx
- name: htpasswd for nginx
  htpasswd:
    path: /etc/nginx/contestadmin_users.htpasswd
    name: admin
    password: "{{mgmt_admin_password}}"
    owner: root
    group: www-data
    mode: 0640

# Certbot configuration for Let's Encrypt SSL
- name: create webroot directory for certbot challenges
  file:
    path: /var/lib/letsencrypt
    state: directory
    owner: www-data
    group: www-data
    mode: 0755

- name: Check if letsencrypt cert exists
  ansible.builtin.stat:
    path: /etc/letsencrypt/live/{{ external_hostname }}/fullchain.pem
  register: letsencrypt_cert
- name: Create symlink for ssl-cert.conf if we don't have our cert yet
  ansible.builtin.file:
    src: /etc/nginx/snippets/snakeoil.conf
    dest: /etc/nginx/snippets/ssl-config.conf
    state: link
  when: not letsencrypt_cert.stat.exists
  notify: Restart nginx

# Make sure nginx is running at this point
- meta: flush_handlers

# Use certbot to get an ssl cert
- name: obtain SSL certificate with certbot
  when: letsencrypt_enabled | bool
  command: >
    certbot certonly --webroot --webroot-path=/var/lib/letsencrypt
    --non-interactive --agree-tos --email {{ letsencrypt_email }}
    --deploy-hook "systemctl reload nginx"
    -d {{ external_hostname }}
  args:
    creates: "/etc/letsencrypt/live/{{ external_hostname }}/fullchain.pem"

- name: configure nginx ssl cert
  when: letsencrypt_enabled | bool
  copy:
    dest: /etc/nginx/snippets/ssl-config.conf
    content: |
      ssl_certificate /etc/letsencrypt/live/{{ external_hostname }}/fullchain.pem;
      ssl_certificate_key /etc/letsencrypt/live/{{ external_hostname }}/privkey.pem;
      ssl_trusted_certificate /etc/letsencrypt/live/{{ external_hostname }}/chain.pem;
  notify: Restart nginx

- name: Create the user contestforge publishes to /configs/ as
  user:
    name: configs
    comment: contestforge publisher
    home: /var/lib/configs
    shell: /bin/sh
    system: true
- name: Create /srv/configs, served at /configs/
  file:
    path: /srv/configs
    state: directory
    owner: configs
    group: configs
    recurse: true
- name: Let configs_publisher_keys rsync into /srv/configs, and nothing else
  ansible.posix.authorized_key:
    user: configs
    key: "{{ configs_publisher_keys | join('\n') }}"
    key_options: restrict,command="/usr/bin/rrsync /srv/configs"
    exclusive: true
  when: configs_publisher_keys | length > 0
- name: Copy published_configs_dir to /srv/configs
  ansible.posix.synchronize:
    src: "{{ published_configs_dir }}/"
    dest: /srv/configs/
    delete: true
    rsync_opts: ["--exclude=.contestforge-cache", "--chmod=D755,F644", "--chown=configs:configs"]
  when: published_configs_dir | length > 0

- name: create web directory
  file:
    state: directory
    dest: /srv/contestweb
    owner: "{{ ansible_user }}"
    group: www-data
    mode: 0755
