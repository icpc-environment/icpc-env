---
# The inventory hostname is the server's public DNS name. It's used for the
# letsencrypt certificate, and is what images set remote_management_server to.
external_hostname: "{{ inventory_hostname }}"
# WireGuard endpoint handed to clients
external_ip: "{{ ansible_default_ipv4.address }}"

# The server's own key's public half and certificate, and a backup of
# wg-fleet's host CA
server_secrets_dir: "{{ playbook_dir }}/../secrets/mgmt/{{ inventory_hostname }}"

wg_fleet_image: ghcr.io/ubergeek42/wg-fleet:main

coredns_version: 1.14.7
wstunnel_version: 11.0.0

# Set to false where the hostname isn't publicly reachable (a test VM); nginx
# then keeps the self-signed snakeoil certificate.
letsencrypt_enabled: true
letsencrypt_email: kj@ubergeek42.com

# Clients that stop pinging wg-fleet for this long are removed
fleet_timeout: 5m

# contestforge's signed list of fleets, which wg-fleet serves alongside the
# static ones below. config_signers are the allowed_signers lines it must be
# signed with, the same ones images are built with. null serves only these.
fleets_url: "https://{{ external_hostname }}/configs/fleets.json"
config_signers:
  - contestforge namespaces="contestforge" ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIF4MLsZ9AwUhSpgtPkOG5LmVbYLVIiSb23pZXfOtRotM

# How long wg-fleet keeps the interface of a fleet that left fleets.json (or
# expired) after its last client is gone
removed_fleet_grace: 24h

# The server is also the bucket images' config_url points at: contestforge's
# published files (contests.json, <contest>/tree.json, <site>/config.json,
# fleets.json and their .sig files) are served from /srv/configs at
# https://<server>/configs/. These keys may replace them, as user "configs",
# which can only rsync into that directory:
#
#   rsync -a --delete --delay-updates --exclude=.contestforge-cache \
#     instance/deployments/ configs@<server>:
configs_publisher_keys:
  - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKz4c0fP0/1Dn6l7Aa6Uev5OOLraN53rS6DdqB9+lYTm contestforge publisher

# Or copy a local directory of published files there on every deploy, e.g.
# contestforge's instance/deployments. Empty leaves /srv/configs alone.
published_configs_dir: ""

# Static fleets: the setup fleet images join before setup (named after their
# contest_id), and contests not managed in contestforge. Each gets its own
# wireguard interface, a login user for its admins (keys in secret.yml), and a
# last-minute git repo at /git/<name>.git.
#
# Generate a new subnet with:
#   echo "fd`openssl rand -hex 5 | fold -w2 | paste -sd: | sed 's/^/:/'`::/64"
# Ports must be in 51820-51920; nginx only proxies wstunnel to that range.
fleets:
  generic:
    subnet: fd00:a0a8:34d:9900::/64
    ip: fd00:a0a8:34d:9900::1
    port: 51920
