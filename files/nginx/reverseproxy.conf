server_names_hash_bucket_size 128;
# use our dnsmasq server (which points at systemd's upstream resolv.conf file)
resolver 127.0.0.55 ipv6=off;

server {
  listen 127.0.0.1:80 default_server;
  listen 127.0.0.1:443 ssl default_server;
  server_name _;
  ssl_certificate /etc/ssl/reverseproxy.crt;
  ssl_certificate_key /etc/ssl/reverseproxy.key;

  root /opt/localwww;
}

# Local devdocs server (on 127.0.0.10)
server {
        listen 127.0.0.10:80;
        server_name devdocs;
        return 301 https://$host$request_uri;
}
server {
        listen 127.0.0.10:443 ssl;
        server_name devdocs;
        ssl_certificate /etc/ssl/devdocs.crt;
        ssl_certificate_key /etc/ssl/devdocs.key;
        location  / {
                proxy_pass http://127.0.0.10:9292;
                proxy_ssl_server_name on;
                proxy_set_header Host $host;
        }
}

# The allowed sites (reverseproxy_sites), each a server including icpc-proxy.conf
include /etc/nginx/icpc-sites.conf;
