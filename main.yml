---
- name: Do Everything
  hosts: vm
  become: true
  user: imageadmin
  gather_facts: true
  vars:
    ansible_python_interpreter: /usr/bin/python3

  tasks:
    - name: Include apt sources
      ansible.builtin.import_tasks: 'playbooks/apt-sources.yml'

    - name: Disable fsync for dpkg
      ansible.builtin.copy:
        content: |
          force-unsafe-io
        dest: /etc/dpkg/dpkg.cfg.d/02-dpkg-no-sync
        mode: "0644"
    - name: Disable apt cache
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/02-fast-apt
        mode: "0644"
        content: |
          # Disable some apt-caching
          Dir::Cache {
            srcpkgcache "";
            pkgcache "";
          }
          # No translations
          Acquire::Language "none";

    - name: Run apt-get update
      ansible.builtin.apt:
        update_cache: true
        upgrade: dist

    - name: Set up efi booting
      ansible.builtin.apt:
        pkg:
          - grub-efi
          - grub-efi-amd64-signed
        state: present

    - name: Run grub-install for efi
      ansible.builtin.command: grub-install --no-nvram --uefi-secure-boot --target=x86_64-efi /dev/sda
      args:
        creates: /boot/efi/EFI/ubuntu/grub.cfg

    - name: Remove snap package
      ansible.builtin.apt:
        name: snapd
        purge: true
        state: absent

    - name: Clean up any leftover snap data
      ansible.builtin.file:
        state: absent
        path: "{{ item }}"
      with_items:
        - /snap
        - /var/snap
        - /var/lib/snapd
        - /var/cache/snapd
        - /run/snapd-snap.socket
        - /run/snapd.socket
        - /etc/apt/apt.conf.d/20snapd.conf

    - name: Prevent snapd from being installed later
      ansible.builtin.copy:
        dest: /etc/apt/preferences.d/snapd-disable
        content: |
          Package: snapd
          Pin: release *
          Pin-Priority: -10
        mode: "0644"
        owner: "root"
        group: "root"

    # remove cloud init, because it's a security issue (a cd/other usb drive could give someone root)
    - name: Remove cloud-init
      ansible.builtin.apt:
        pkg: cloud-init
        state: absent
        purge: true

    - name: Delete cloud-init netplan file
      ansible.builtin.file:
        state: absent
        path: /etc/netplan/50-cloud-init.yaml

    - name: Clean up old ubuntu.sources from installation time
      ansible.builtin.file:
        path: /etc/apt/sources.list.d/ubuntu.sources.curtin.orig
        state: absent

    - name: Include gui
      ansible.builtin.import_tasks: 'playbooks/gui.yml'
    - name: Include contestant home
      ansible.builtin.import_tasks: 'playbooks/contestant_home/homedir.yml'
    - name: Include ca
      ansible.builtin.import_tasks: 'playbooks/ca.yml'
    - name: Include reverseproxy
      ansible.builtin.import_tasks: 'playbooks/reverseproxy.yml'
    - name: Include compilers
      ansible.builtin.import_tasks: 'playbooks/compilers.yml'
    - name: Include devel_tools
      ansible.builtin.import_tasks: 'playbooks/devel_tools.yml'

    - name: Include icpc
      ansible.builtin.import_tasks: 'playbooks/icpc.yml'
    - name: Include vmtouch
      ansible.builtin.import_tasks: 'playbooks/vmtouch.yml'

    - name: Include network security (squid and nftables)
      ansible.builtin.import_tasks: 'playbooks/security/network.yml'
    - name: Include system restrictions
      ansible.builtin.import_tasks: 'playbooks/security/system-restrictions.yml'
    - name: Include system
      ansible.builtin.import_tasks: 'playbooks/system.yml'

    - name: Include ccs related things
      ansible.builtin.import_tasks: 'playbooks/ccs/ccs.yml'

    # Management related things
    - name: Configure lastminute ansible execution (if enabled)
      ansible.builtin.include_tasks: 'playbooks/management/ansible-pull.yml'
      when: remote_management_server and (remote_management_lastminute_enabled | bool)

    - name: Configure remote management vpn (if enabled)
      ansible.builtin.include_tasks: 'playbooks/management/vpn.yml'
      when: remote_management_server and (remote_management_vpn_enabled | bool)

    - name: Configure monitoring
      ansible.builtin.include_tasks: 'playbooks/management/monitoring.yml'

    - name: Autoremove/autoclean/clean apt
      block:
        - name: Run apt autoremove
          ansible.builtin.apt:
            autoremove: true
        - name: Run apt autoclean
          ansible.builtin.apt:
            autoclean: true
        - name: Run apt clean
          ansible.builtin.apt:
            clean: true

    - name: Include apt sources reset
      ansible.builtin.import_tasks: 'playbooks/apt-sources-reset.yml'

    # Copy some build information to the image
    - name: Gather build information  # noqa: command-instead-of-shell risky-shell-pipe
      ansible.builtin.shell: 'echo -e "Built on $(date +"%Y-%m-%d %H:%M:%S")\nRevision: $(git rev-list --full-history --all --abbrev-commit | head -1)\n"'
      become: false
      register: git_revision
      delegate_to: 127.0.0.1
      changed_when: true
    - name: Copy version info
      ansible.builtin.copy:
        content: "{{ git_revision.stdout }}\n"
        dest: /icpc/version
        mode: "0644"
        owner: "root"
        group: "root"

  handlers:
    - name: Clear user password
      ansible.builtin.command: passwd -d contestant
      changed_when: true

    - name: Update grub
      ansible.builtin.command: /usr/sbin/update-grub
      changed_when: true

    - name: Restart squid
      ansible.builtin.service:
        name: squid
        state: restarted

    - name: Run update-ca-certificates
      ansible.builtin.command: /usr/sbin/update-ca-certificates
      changed_when: true

    - name: Restart ssh
      ansible.builtin.service:
        name: ssh
        state: restarted
        enabled: true

    - name: Restart nftables
      ansible.builtin.service:
        name: nftables
        state: restarted
        enabled: true

    - name: Reload nginx
      ansible.builtin.service:
        name: nginx
        state: reloaded
