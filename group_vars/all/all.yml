---
icpc_timezone: 'America/New_York'
icpcadmin_pass: icpcadmin

# On the config server, what contest id is this for. Files will be fetched from {{ config_url }}/{{ contest_id }}
contest_id: generic

# Install a submit client for a contest control system (domjudge, pc2, or kattis)
submit_ccs: 'kattis'

# Set to the hostname of a remote management server. See RemoteManagement.md for more details
# This is the host that has your lastminute git repositories, as well as a wg-fleet install that is aware of your contest-id
# Set to null to disable the remote vpn and lastminute ansible
remote_management_server: null
# Whether to connect to the wg-fleet wireguard vpn?
remote_management_vpn_enabled: true
# Whether to run ansible-pull to apply any last minute changes on system boot.
remote_management_lastminute_enabled: true

# This is the config server used by the icpc_setup script. It contains sites, teams, and printer configurations.
# See the readme for more information on what files this server needs to return
config_url: http://configs.cloudcontest.org

# # Firefox policies. Documented here:
# https://mozilla.github.io/policy-templates/
firefox_default_policies:
  # Disable internet checking (it'll fail when the proxy is on so we want to avoid the notification banner)
  CaptivePortal: false
  # Prevent updating (shouldn't happen on linux, but we want to avoid it anyway)
  DisableAppUpdate: true
  # Prevent first run page/post update pages from showing up
  OverrideFirstRunPage: ""
  OverridePostUpdatePage: ""
  # What it says on the tin. This is to prevent a banner on first start about what it's sharing
  DisableTelemetry: true
  # Disable DNS over HTTPS (this might get around filters/things)
  DNSOverHTTPS:
    Enabled: false
  # Install the squid CA so it can mitm things/properly filter the network
  Certificates: {
    ImportEnterpriseRoots: true,
    Install: ["/etc/squid/squidCA.crt"]
  }

  # Other Preferences that don't have specific policies
  Preferences:
    browser.urlbar.suggest.topsites: false # don't suggest top sites in the urlbar (Removes youtube/wikipedia/reddit)
    browser.ml.chat.menu: false            # disable the generative AI chat menu

  SearchEngines:
    Remove: ["Google", "Bing", "DuckDuckGo", "Wikipedia (en)"]
    Default: "DevDocs"
    Add:
      - Name: "DevDocs"
        URLTemplate: "https://devdocs?q={searchTerms}"
        IconURL: "https://devdocs/favicon.ico"

  # Disable all the Generative AI stuff
  GenerativeAI:
    Chatbot: false
    LinkPreviews: false
    TabGroups: false
    Locked: true

  # Disable a bunch of random features we don't need
  DisablePocket: true
  DisableFirefoxStudies: true
  DisableFirefoxAccounts: true
  DisableFeedbackCommands: true
  NewTabPage: false
  NoDefaultBookmarks: true
  DisableProfileImport: true
  SearchSuggestEnabled: false

  # Disable a bunch of messages
  UserMessaging:
    WhatsNew: false
    ExtensionRecommendations: false
    FeatureRecommendations: false
    UrlbarInterventions: false
    SkipOnboard: true
    MoreFromMozilla: false
    Locked: true
  SkipTermsOfUse: true

ca_target_certs:
  - { name: "devdocs", cn: "reverseproxy", hostnames: "devdocs,libretranslate,icpc"}
  - { name: "vscgallery", cn: "marketplace.visualstudio.com", hostnames: "update.code.visualstudio.com,az764295.vo.msecnd.net,marketplace.visualstudio.com"}
