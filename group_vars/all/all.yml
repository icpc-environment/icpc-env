---
icpc_timezone: 'America/New_York'
icpcadmin_pass: icpcadmin

# authorized_keys lines that let the build and dev tooling log in as icpcadmin.
# They go in ~icpcadmin/.ssh/authorized_keys2, which makeDist.sh deletes, so
# they never reach a finished image. build-final.sh sets its own.
build_ssh_keys: []

# How admins get in before setup; a site's config replaces each of these that it
# sets. ssh_keys are icpcadmin's authorized_keys lines. Certificates signed by
# one of ssh_user_ca_keys log in as icpcadmin if they carry one of ssh_principals.
# With contestforge's user CA (`flask ssh-ca show`), node:* lets in global
# admins and server:<management server> that server's own key:
#
#   ssh_user_ca_keys: ["ssh-ed25519 AAAA... contestforge user CA"]
#   ssh_principals: ["node:*", "server:mgmt.env.cloudcontest.org"]
ssh_keys: []
ssh_user_ca_keys: []
ssh_principals: []

# The desktop wallpaper, which the team name and affiliation are drawn on: a
# file relative to the repo root, or an http(s) URL the build downloads.
icpc_wallpaper: files/wallpaper.png

# This image's contest: the static WireGuard fleet machines join before setup,
# and its last-minute ansible-pull repo on the management server
contest_id: generic

# The contest's node id in contestforge (e.g. BigSouth2026/SouthEast). The setup
# wizard offers only its sites; empty lets whoever sets up the machine pick
# any contest in {{ config_url }}/contests.json
config_contest: ""

# Which submit client /usr/local/bin/submit points at (domjudge, pc2, or
# kattis). All of them are installed.
submit_ccs: 'kattis'

# Where the pc2 and DOMjudge submit clients post to (kattis ignores it)
submit_base_url: https://pc2server.icpc-vcss.org:50443

# Send contestant printing through icpc-printer, a local IPP server that stamps
# "<hostname> · job <id> · n/N" on every page, can add a cover page, archives
# each job in /var/lib/icpc-printer and forwards it to the printers the setup
# wizard configures. Contestants print to the "icpc" queue; only icpc-printer
# can submit to the real ones. Needs files/icpc-printer_*_amd64.deb, built by
# `just package` in the icpc-printer repo.
icpc_printer_enabled: false

# Only used when icpc_printer_enabled is set. An optional cover page for every
# job, as one PDF per paper size the setup wizard may pick, each that size:
#
#   icpc_printer_coverpages:
#     letter: files/coverpage-letter.pdf
#     a4: files/coverpage-a4.pdf
icpc_printer_coverpages: {}

# How the image filters traffic.
#
#   nftables        - the ruleset in playbooks/security/nftables.yml, which
#                     blocks the contestant user from the network directly and
#                     leaves everything else to squid.
#   iptables_static - a ruleset a contest already maintains, taken verbatim from
#                     iptables_rules below.
firewall_backend: nftables

# Only used when firewall_backend is 'iptables_static'. Set to the contents of
# an iptables-save file, e.g.
#
#   iptables_rules: |
#     *filter
#     :INPUT ACCEPT [0:0]
#     -A INPUT -i lo -j ACCEPT
#     COMMIT
iptables_rules: null

# Set to the hostname of a remote management server. See management/README.md for more details
# Until the setup wizard runs, machines join the fleet named contest_id on it
# (a static fleet anyone can register in) and pull its last-minute repo. A site
# config's management settings then replace these.
# Set to null to disable the remote vpn and lastminute ansible before setup
remote_management_server: null
# Whether to connect to the wg-fleet wireguard vpn?
remote_management_vpn_enabled: true
# Whether to run ansible-pull to apply any last minute changes on system boot.
remote_management_lastminute_enabled: true

# Where contestforge publishes its files (contests.json, <contest>/tree.json,
# <site>/config.json), which the setup wizard reads the site's teams, printers
# and settings from
config_url: https://configs.cloudcontest.org/v2

# The keys whose signatures the setup wizard accepts on those files, as
# ssh-keygen allowed_signers lines with principal contestforge. contestforge
# prints its line with `flask signing-key init`. Several lines are fine, e.g.
# while rotating keys:
#
#   config_signers:
#     - contestforge ssh-ed25519 AAAA...
config_signers: []

# # Firefox policies. Documented here:
# https://mozilla.github.io/policy-templates/
# Firefox gets firefox_default_policies, then the contest's firefox_policies
# (from /icpc/config.json) on top, then firefox_fixed_policies on top of both.
# Policies that are dictionaries are merged key by key.

# What the image needs to work, whatever the contest's config says
firefox_fixed_policies:
  # Disable internet checking (it'll fail when the proxy is on so we want to avoid the notification banner)
  CaptivePortal: false
  # Prevent updating (shouldn't happen on linux, but we want to avoid it anyway)
  DisableAppUpdate: true
  # Disable DNS over HTTPS (this might get around filters/things)
  DNSOverHTTPS:
    Enabled: false
  # Install the squid CA so it can mitm things/properly filter the network
  Certificates: {
    ImportEnterpriseRoots: true,
    Install: ["/etc/squid/squidCA.crt"]
  }

firefox_default_policies:
  # Prevent first run page/post update pages from showing up
  OverrideFirstRunPage: ""
  OverridePostUpdatePage: ""
  # What it says on the tin. This is to prevent a banner on first start about what it's sharing
  DisableTelemetry: true

  # Other Preferences that don't have specific policies
  Preferences:
    browser.urlbar.suggest.topsites: false # don't suggest top sites in the urlbar (Removes youtube/wikipedia/reddit)
    browser.ml.chat.menu: false            # disable the generative AI chat menu

  SearchEngines:
    Remove: ["Google", "Bing", "DuckDuckGo", "Wikipedia (en)"]
    Default: "DevDocs"
    Add:
      - Name: "DevDocs"
        URLTemplate: "https://devdocs?q={searchTerms}"
        IconURL: "https://devdocs/favicon.ico"

  # Disable all the Generative AI stuff
  GenerativeAI:
    Chatbot: false
    LinkPreviews: false
    TabGroups: false
    Locked: true

  # Disable a bunch of random features we don't need
  DisablePocket: true
  DisableFirefoxStudies: true
  DisableFirefoxAccounts: true
  DisableFeedbackCommands: true
  NewTabPage: false
  NoDefaultBookmarks: true
  DisableProfileImport: true
  SearchSuggestEnabled: false

  # Disable a bunch of messages
  UserMessaging:
    WhatsNew: false
    ExtensionRecommendations: false
    FeatureRecommendations: false
    UrlbarInterventions: false
    SkipOnboard: true
    MoreFromMozilla: false
    Locked: true
  SkipTermsOfUse: true

# The CA tooling. smallstep is not in the ubuntu archive, so this is pinned to
# a release .deb - check https://github.com/smallstep/cli/releases and bump.
step_cli_version: 0.31.0

ca_target_certs:
  - { name: "devdocs", cn: "reverseproxy", hostnames: "devdocs,libretranslate,icpc"}
  - { name: "vscgallery", cn: "marketplace.visualstudio.com", hostnames: "update.code.visualstudio.com,az764295.vo.msecnd.net,marketplace.visualstudio.com"}

# Where apt packages come from while the image is being built.
#   ubuntu - the public Ubuntu archive plus each vendor's own apt repository
#   pc2    - the ICPC sysops mirror, which carries its own copies of all of them
# See playbooks/apt-sources.yml for what each one does.
apt_package_source: ubuntu

# Only used when apt_package_source is 'ubuntu'. The installer writes the
# archive host below into ubuntu.sources; set apt_ubuntu_mirror to swap it for
# a faster one during the build. The original is restored before the image is
# finalized, so this only affects build time. Null leaves it alone.
# Pick one from https://launchpad.net/ubuntu/+archivemirrors
apt_ubuntu_default_mirror: us.archive.ubuntu.com
apt_ubuntu_mirror: null

# Only used when apt_package_source is 'pc2'. The signing keys are not in this
# repo; put them in files/apt-keys/ before building with this source.
apt_pc2_mirror_url: https://sysopspackages.icpc.global
apt_pc2_keys:
  ubuntu: pc2packages.asc
  jetbrains: jetbrains.list.asc
  vscode: vscode.list.asc
  firefox: firefox.list.asc
  sysopspackages: pc2packages.asc
apt_pc2_repositories:
  - {name: ubuntu, path: 'ubuntu-{{ ansible_distribution_release }}'}
  - {name: jetbrains, path: 'jetbrains-{{ ansible_distribution_release }}'}
  - {name: vscode, path: 'vscode-{{ ansible_distribution_release }}'}
  - {name: firefox, path: 'mozillateam-{{ ansible_distribution_release }}'}
  - {name: sysopspackages, path: 'apt/{{ ansible_distribution_release }}'}
