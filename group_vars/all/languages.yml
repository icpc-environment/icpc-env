---
# Simple wrapper scripts to install on the image, so that contestants have a consistent view of how to compile and run programs
# that matches with how the contest control system will run it.
# These scripts match open.kattis.com as of 2026-10-16
# The memory limits for runjava/runkotlin will need to be adjusted for your specific contest problem memory limit
language_scripts:
  compilec:       gcc-15 -g -O2 -std=gnu23 -static "$@" -lm
  compilecpp:     g++-15 -g -O2 -std=gnu++23 -static -lrt -Wl,--whole-archive -lpthread -Wl,--no-whole-archive "$@"
  compilejava:    javac -encoding UTF-8 -sourcepath . -d . "$@"
  compilekotlin:  /usr/local/bin/kotlinc -d . "$@"
  compilepython3: pypy3 -m py_compile "$@"

  runc:       ulimit -s 2097152 && ./a.out "$@"
  runcpp:     ulimit -s 2097152 && ./a.out "$@"
  runjava:    java -Dfile.encoding=UTF-8 -XX:+UseSerialGC -Xss64m -XX:TieredStopAtLevel=1 -XX:ActiveProcessorCount=2 -Xms1920m -Xmx1920m "$@"
  runkotlin:  kotlin -J-XX:+UseSerialGC -J-Xss64m -J-Xms1920m -J-Xmx1920m "$@"
  runpython3: pypy3 "$@"

# Compiler versions. These should match whatever the contest control system
# judges with, so they are pinned here rather than tracking whatever the
# distribution happens to ship.

# https://downloads.python.org/pypy/ - match a version from here
pypy3_version: pypy3.11-v7.3.23

# openjdk-<version>-jdk must exist in the release being built against. 25 is in
# 26.04; building against 24.04 needs 21.
java_version: 25

# Fetched from https://github.com/JetBrains/kotlin/releases
kotlin_version: 2.4.10

# Language documentation built into the devdocs image. devdocs has its own
# version slugs, coarser than the versions above, so these have to be kept in
# step with pypy3_version/java_version/kotlin_version by hand. The same list is
# used for the docs devdocs downloads and the ones it shows by default.
devdocs_docs:
  - c
  - cpp
  - kotlin~2.4
  - openjdk~25
  - python~3.11

# Which compilers/languages to install
languages:
  - c
  - cpp
  - java
  - kotlin
  - python3
